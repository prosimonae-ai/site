# Garde le projet Supabase (gratuit) éveillé : une lecture par jour suffit
# pour qu'il ne soit pas mis en pause après une semaine sans activité.
# La clé utilisée est la clé publique « anon », déjà présente dans les pages du site.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'   # tous les jours vers 7 h / 8 h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SB_URL: https://vxzjfwjxgewdqvfdsxjm.supabase.co
      SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4empmd2p4Z2V3ZHF2ZmRzeGptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTM1MDcsImV4cCI6MjEwNDM4OTUwN30.IuIcPXXrVozPDDreB-hkY1didQoboV0pEuH8-8GaWLo
    steps:
      - name: Lecture des tables
        run: |
          fail=0
          for t in users wishlist courses_state; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
              "$SB_URL/rest/v1/$t?select=id&limit=1" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
            echo "$t → HTTP $code"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "::error::Supabase ne répond pas. Le projet est peut-être en pause : relance-le sur supabase.com (Restore project)."
            exit 1
          fi
