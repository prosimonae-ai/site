<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimonnAE</title>
  <link rel="icon" href="assets/logo-pink.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/kid8vvq.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    /* Si l'intro a déjà été vue, aller directement sur reels.html */
    if (sessionStorage.getItem('introSeen_v2')) {
      location.replace('reels.html');
    }
  </script>
</head>
<body class="no-scroll">

  <div id="intro">
    <div class="intro-content">
      <img class="intro-name-img" src="assets/name-pink.svg" alt="SIMONN.AE" />
      <p class="intro-sound-label">Avec le son ?</p>
      <div class="intro-sound-btns">
        <button id="enterWithSound" class="intro-sound-btn intro-sound-yes">Oui ↗</button>
        <button id="enterNoSound"   class="intro-sound-btn intro-sound-no">Non</button>
      </div>
    </div>
  </div>

  <script>
    const intro = document.getElementById('intro');

    function enterSite(withSound) {
      sessionStorage.setItem('introSeen_v2', '1');
      sessionStorage.setItem('introSound', withSound ? '1' : '0');
      intro.classList.add('leaving');
      setTimeout(() => { location.href = 'reels.html'; }, 700);
    }

    const sfxOui = new Audio('sound/Oui .wav');
    sfxOui.volume = 0.10;
    const sfxNon = new Audio('sound/Non.wav');
    sfxNon.volume = 0.10;

    document.getElementById('enterWithSound').addEventListener('click', () => {
      sfxOui.play().catch(() => {});
      enterSite(true);
    });
    document.getElementById('enterNoSound').addEventListener('click', () => {
      sfxNon.play().catch(() => {});
      setTimeout(() => { sfxNon.pause(); sfxNon.currentTime = 0; }, 2000);
      enterSite(false);
    });
  </script>
</body>
</html>
