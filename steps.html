<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#04030a;
  --gold:#c89410;
  --gold-lt:#f0c030;
  --crimson:#8c1c3c;
  --crimson-lt:#cc2858;
  --text:#d8c8a8;
  --text-dim:#7a6a4a;
  --hp:#a01820;
  --pa:#1860a0;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Cinzel',serif;}
canvas#cvs{position:fixed;top:0;left:0;width:100%;height:100%;display:block;}

/* ── HUD ─────────────────────────────────────────────────────────── */
#hud{
  position:fixed;top:0;left:0;right:0;
  display:flex;align-items:center;gap:8px;
  padding:8px 12px 6px;
  background:linear-gradient(to bottom,rgba(4,3,10,.88) 60%,transparent);
  pointer-events:none;z-index:10;
}
.hud-stat{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.06em;}
.hud-bar{width:56px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.hud-bar-fill{height:100%;border-radius:2px;transition:width .3s;}
.hp-fill{background:var(--hp);}
.pa-fill{background:var(--pa);}
.hud-sep{flex:1;}
#hud-floor{font-size:9px;color:var(--text-dim);letter-spacing:.14em;}
#hud-amulette{font-size:13px;display:none;}

#steps-display{
  position:fixed;top:30px;right:10px;
  font-size:8px;color:var(--text-dim);letter-spacing:.1em;
  z-index:10;pointer-events:none;
}

/* ── EXPLORE PANEL ───────────────────────────────────────────────── */
#z1-panel{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(4,3,10,.97) 72%,transparent);
  padding:12px 14px 22px;
  z-index:20;
  transition:transform .28s ease;
}
#z1-panel.hidden{transform:translateY(110%);}
.panel-label{font-size:8px;letter-spacing:.2em;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;}
.room-desc{
  font-size:11px;color:var(--text);
  margin-bottom:10px;min-height:28px;
  font-family:'IM Fell English',serif;font-style:italic;line-height:1.5;
}
.choices{display:flex;flex-direction:column;gap:5px;}
.btn{
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.09);
  border-radius:2px;
  padding:9px 12px;
  font-family:'Cinzel',serif;font-size:11px;
  color:var(--text);cursor:pointer;
  -webkit-user-select:none;user-select:none;
  transition:background .12s,border-color .12s;
  text-align:left;width:100%;
}
.btn:active{background:rgba(255,255,255,.09);border-color:var(--gold);}
.btn.primary{border-color:rgba(200,148,16,.5);color:var(--gold-lt);}
.btn.danger{border-color:rgba(140,28,28,.5);color:#ff7070;}
.btn.dim{opacity:.32;pointer-events:none;}
.btn .cost{margin-left:auto;font-size:9px;color:var(--text-dim);flex-shrink:0;}

/* ── COMBAT ──────────────────────────────────────────────────────── */
#screen-combat{
  position:fixed;top:0;left:0;right:0;bottom:0;
  z-index:30;display:flex;flex-direction:column;
  pointer-events:none;
}
#screen-combat.active{pointer-events:all;}
#combat-log{
  position:absolute;bottom:185px;left:0;right:0;
  padding:0 14px;max-height:78px;overflow:hidden;
  display:flex;flex-direction:column;gap:3px;
}
.log-line{
  font-size:10px;color:var(--text);
  background:rgba(4,3,10,.84);
  padding:3px 8px;border-radius:2px;
  border-left:2px solid rgba(200,148,16,.4);
}
.log-line.dmg{border-left-color:rgba(180,40,40,.8);}
.log-line.heal{border-left-color:rgba(40,160,60,.8);}
#combat-panel{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(4,3,10,.99) 78%,transparent);
  padding:10px 14px 20px;
}
.enemy-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.enemy-name{font-size:10px;letter-spacing:.1em;color:#ff8080;flex:1;}
.enemy-hp-track{flex:0 0 90px;height:3px;background:rgba(255,255,255,.07);}
.enemy-hp-fill{height:100%;background:#7a1c1c;transition:width .3s;}
#combat-hp-val{font-size:9px;color:#ff7070;}
.combat-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}

/* ── NIGHT ───────────────────────────────────────────────────────── */
#screen-night{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(4,3,10,.96);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:28px;
  transition:opacity .7s;
}
#screen-night.hidden{opacity:0;pointer-events:none;}
.night-icon{font-size:46px;}
.night-title{font-size:16px;letter-spacing:.22em;color:var(--gold-lt);}
.night-text{font-size:12px;color:var(--text-dim);max-width:270px;line-height:1.65;font-family:'IM Fell English',serif;}
.night-btn{
  background:rgba(200,148,16,.1);border:1px solid var(--gold);
  border-radius:2px;padding:11px 22px;
  color:var(--gold-lt);font-family:'Cinzel',serif;font-size:12px;
  letter-spacing:.1em;cursor:pointer;margin-top:6px;
}

/* ── DEATH ───────────────────────────────────────────────────────── */
#screen-death{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(4,3,10,.97);z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:28px;
  transition:opacity .7s;
}
#screen-death.hidden{opacity:0;pointer-events:none;}

/* ── EVENT ───────────────────────────────────────────────────────── */
#screen-event{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(4,3,10,.93);z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:11px;text-align:center;padding:28px;
}
#screen-event.hidden{display:none;}
#event-choices{width:100%;max-width:300px;}

/* ── PA WARNING ──────────────────────────────────────────────────── */
#pa-warn{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(4,3,10,.92);border:1px solid var(--gold);
  border-radius:3px;padding:14px 22px;
  font-size:12px;color:var(--gold-lt);letter-spacing:.06em;
  z-index:70;pointer-events:none;opacity:0;transition:opacity .25s;
  white-space:nowrap;
}
#pa-warn.show{opacity:1;}
</style>
</head>

<!-- DEATH SCREEN -->
<div id="screen-death" class="hidden">

<!-- EVENT SCREEN -->
<div id="screen-event" class="hidden">

function parseSpr(lines){return lines.map(r=>[...r].map(c=>PX[c]||null));}
function drawPx(ctx,spr,ox,oy,sc,tint){
  spr.forEach((row,ry)=>row.forEach((col,rx)=>{
    if(!col)return;
    ctx.fillStyle=tint||col;
    ctx.fillRect(Math.round(ox+rx*sc),Math.round(oy+ry*sc),sc,sc);
  }));
}
const PX_INV={};
Object.entries(PX).forEach(([k,v])=>{if(v&&!PX_INV[v])PX_INV[v]=k;});
function drawPxSkin(ctx,spr,ox,oy,sc,pal){
  spr.forEach((row,ry)=>row.forEach((col,rx)=>{
    if(!col)return;
    const ch=PX_INV[col];
    ctx.fillStyle=(ch&&pal[ch])||col;
    ctx.fillRect(Math.round(ox+rx*sc),Math.round(oy+ry*sc),sc,sc);
  }));
}

function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtNum(n){if(!n&&n!==0)return'—';n=Math.round(n);if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toLocaleString('fr-FR');}
function randFrom(arr){return arr[Math.floor(Math.random()*arr.length)];}

// ═══════════════════════════════════════════════════════════════
// SUPABASE SAVE / FETCH
// ═══════════════════════════════════════════════════════════════
async function saveG(partial=null){
  if(!G)return;
  if(partial)Object.assign(G,partial);
  try{
    const payload={...G,updated_at:new Date().toISOString()};
    // Ensure JSON fields are properly typed
    payload.floor_layout=G.floor_layout?JSON.parse(JSON.stringify(G.floor_layout)):null;
    payload.rooms_visited=G.rooms_visited||[];
    payload.inventory=G.inventory||[];
    payload.run_buffs=G.run_buffs||{};
    await db.from('game_state').upsert(payload,{onConflict:'user_id'});
  }catch(e){console.warn('saveG',e);}
}
function saveGD(partial=null){
  if(partial)Object.assign(G,partial);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveG(),1600);
}

async function fetchAll(){
  try{
    const{data:rows}=await db.from('game_state').select('*').limit(1);
    if(!rows||!rows.length){
      G=newG();
      await saveG();
    } else {
      G=rows[0];
      // Patch missing Zone1 fields
      if(G.pa===undefined||G.pa===null)G.pa=0;
      if(!G.daily_steps_tracked)G.daily_steps_tracked=0;
      if(G.has_amulette===undefined)G.has_amulette=false;
      if(!G.floor)G.floor=1;
      if(!G.hp||G.hp>C.HP_MAX)G.hp=C.HP_MAX;
      if(!G.max_hp)G.max_hp=C.HP_MAX;
      if(!G.floor_layout)G.floor_layout=null;
      if(!G.current_room)G.current_room=null;
      if(!G.rooms_visited)G.rooms_visited=[];
      if(!G.inventory)G.inventory=[];
      if(!G.run_buffs)G.run_buffs={};
      if(!G.souls)G.souls=0;
      if(!G.last_day)G.last_day=today();
    }
    if(!G.floor_layout||!G.current_room){generateFloor();await saveG();}
    checkNewDay();
    updatePaFromSteps();
    gameMode='explore';
    updateHUD();
    renderPanel();
  }catch(e){console.error('fetchAll',e);}
}

function newG(){
  return{
    user_id:'default',
    hp:C.HP_MAX,max_hp:C.HP_MAX,
    pa:0,daily_steps_tracked:0,has_amulette:false,
    floor:1,floor_layout:null,current_room:null,
    rooms_visited:[],inventory:[],run_buffs:{},
    souls:0,total_runs:0,skin_id:'crimson',last_day:today(),

}

// ═══════════════════════════════════════════════════════════════
// STEPS + PA
// ═══════════════════════════════════════════════════════════════
function updatePaFromSteps(){
  if(!G)return;
  const tracked=G.daily_steps_tracked||0;
  const newSteps=Math.max(0,stepsToday-tracked);
  if(newSteps<C.PA_PER_STEP)return;
  const gained=Math.floor(newSteps/C.PA_PER_STEP);
  const consumed=gained*C.PA_PER_STEP;
  G.pa=Math.min((G.pa||0)+gained,C.PA_CAP);
  G.daily_steps_tracked=tracked+consumed;
  if(stepsToday>=C.CHARGE&&!G.has_amulette)G.has_amulette=true;
  saveGD();
  updateHUD();
}

function spendPa(n){
  if(!G||G.pa<n){showPaWarn();return false;}
  G.pa-=n;saveGD();updateHUD();return true;
}

function showPaWarn(){
  const el=document.getElementById('pa-warn');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

// ═══════════════════════════════════════════════════════════════
// DAY / NIGHT
// ═══════════════════════════════════════════════════════════════
function checkNewDay(){
  if(!G)return;
  const t=today();
  if(G.last_day&&G.last_day!==t){
    G.daily_steps_tracked=0;
    G.has_amulette=false;
    G.last_day=t;
    stepsToday=0;
    saveGD();
  }
}

function checkNight(){
  if(!G||gameMode==='night'||gameMode==='dead')return;
  const h=new Date().getHours();
  if(h<22&&h>=6)return;
  const key=today()+'-night';
  if(lastNightKey===key)return;
  lastNightKey=key;
  doNight();
}

function doNight(){
  gameMode='night';
  const amu=G.has_amulette;
  const ni=document.getElementById('night-icon');
  const nt=document.getElementById('night-title');
  const nx=document.getElementById('night-text');
  const nb=document.getElementById('night-btn');
  if(amu){
    ni.textContent='🧿';
    nt.textContent='L\'AMULETTE BRILLE';
    nx.textContent='Le Veilleur vous protège cette nuit. Vous traversez les ténèbres indemne.';
    nb.textContent='REPRENDRE';
    nb.onclick=onNightContinue;
    G.has_amulette=false;saveGD();
  } else {
    const dead=Math.random()<C.NIGHT_DEATH_CHANCE;
    ni.textContent='🌑';
    if(dead){
      nt.textContent='LA NUIT VOUS CONSUME';
      nx.textContent='Sans amulette, les ombres vous ont eu. Vous vous effondrez dans les catacombes.';
      nb.textContent='ACCEPTER LA MORT';
      nb.onclick=()=>triggerDeath('Les ténèbres vous ont consumé.');
    } else {
      const dmg=Math.floor(C.HP_MAX*.25);
      G.hp=Math.max(1,G.hp-dmg);saveGD();
      nt.textContent='BLESSÉ DANS LA NUIT';
      nx.textContent=`Sans amulette, les ombres vous griffent dans le sommeil. −${dmg} HP.`;
      nb.textContent='SURVIVRE';
      nb.onclick=onNightContinue;
    }
  }
  showScreen('night');
}

function onNightContinue(){
  gameMode='explore';showScreen(null);updateHUD();renderPanel();
}

// ═══════════════════════════════════════════════════════════════
// FLOOR GENERATION
// ═══════════════════════════════════════════════════════════════
function generateFloor(){
  const fl=G.floor||1;
  const boss=fl%10===0;
  let rooms=[];
  if(boss){
    const r0={id:uid(),type:'entrance',  connections:[],cleared:false};
    const r1={id:uid(),type:'guarded',   connections:[],cleared:false,enemyId:pickEnemy(fl)};
    const r2={id:uid(),type:'antechamber',connections:[],cleared:false};
    const r3={id:uid(),type:'boss',      connections:[],cleared:false};
    r0.connections=[r1.id];r1.connections=[r0.id,r2.id];
    r2.connections=[r1.id,r3.id];r3.connections=[r2.id];
    rooms=[r0,r1,r2,r3];
  } else {
    const cnt=5+Math.floor(Math.random()*3);
    const pool=['entrance'];
    const mid=['corridor','corridor','guarded','guarded','ossuary','chapel','merchant','fountain','junction'];
    for(let i=1;i<cnt-1;i++)pool.push(randFrom(mid));
    pool.push('exit');
    rooms=pool.map(t=>({id:uid(),type:t,connections:[],cleared:false,enemyId:t==='guarded'?pickEnemy(fl):null}));
    for(let i=0;i<rooms.length-1;i++){
      rooms[i].connections.push(rooms[i+1].id);
      rooms[i+1].connections.push(rooms[i].id);
    }
    if(rooms.length>=5&&Math.random()<0.4){
      const bi=1+Math.floor(Math.random()*(rooms.length-3));
      const br={id:uid(),type:randFrom(['ossuary','chapel','fountain']),connections:[rooms[bi].id],cleared:false};
      rooms[bi].connections.push(br.id);
      rooms.push(br);
    }
  }
  G.floor_layout={rooms};
  G.current_room=rooms[0].id;
  G.rooms_visited=[rooms[0].id];
}

function pickEnemy(fl){
  const tiers=[
    ['e_bone','e_shadow','e_worm'],
    ['e_bone','e_spectre','e_shadow','e_scavenger'],
    ['e_spectre','e_sentinel','e_shadow','e_worm','e_scavenger'],
  ];
  return randFrom(tiers[Math.min(Math.floor((fl-1)/3),2)]);
}

function getRoom(){
  if(!G?.floor_layout?.rooms||!G.current_room)return null;
  return G.floor_layout.rooms.find(r=>r.id===G.current_room)||null;
}
function getRoomById(id){
  return G?.floor_layout?.rooms?.find(r=>r.id===id)||null;
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function moveToRoom(id){
  if(!spendPa(C.MOVE_COST))return;
  G.current_room=id;
  if(!G.rooms_visited.includes(id))G.rooms_visited.push(id);
  saveGD();
  const room=getRoomById(id);
  if(room&&!room.cleared)triggerRoom(room);
  else renderPanel();
}

function triggerRoom(room){
  if(room.type==='guarded'){startCombat(room);}
  else if(room.type==='boss'){startBoss();}
  else if(room.type==='ossuary'){evtOssuary(room);}
  else if(room.type==='chapel'){evtChapel(room);}
  else if(room.type==='fountain'){evtFountain(room);}
  else renderPanel();
}

function advanceFloor(){
  if(!spendPa(C.MOVE_COST))return;
  G.floor=(G.floor||1)+1;
  G.floor_layout=null;G.current_room=null;G.rooms_visited=[];
  generateFloor();saveGD();updateHUD();renderPanel();
}

// ═══════════════════════════════════════════════════════════════
function showEvt(icon,title,text,choices){
  gameMode='event';
  document.getElementById('event-icon').textContent=icon;
  document.getElementById('event-title').textContent=title;
  const tx=document.getElementById('event-text');
  tx.textContent=text;tx.style.color='var(--text)';
  const ec=document.getElementById('event-choices');
  ec.innerHTML='';
  choices.forEach(ch=>{
    const b=document.createElement('button');
    b.className='btn';b.textContent=(ch.icon?ch.icon+' ':'')+ch.label;
    b.onclick=ch.fn;ec.appendChild(b);
  });
  showScreen('event');
}

function evtResult(msg,type=''){
  const tx=document.getElementById('event-text');
  tx.textContent=msg;
  tx.style.color=type==='heal'?'#30c060':type==='dmg'?'#ff6060':'var(--text)';
  document.getElementById('event-title').textContent='RÉSULTAT';
  const ec=document.getElementById('event-choices');
  ec.innerHTML='';
  const b=document.createElement('button');
  b.className='btn primary';b.textContent='CONTINUER';
  b.onclick=()=>{showScreen(null);gameMode='explore';updateHUD();renderPanel();};
  ec.appendChild(b);
}

function evtOssuary(room){
  const hasKey=G.inventory.some(i=>i.id==='k_broken');
  const choices=[];
  if(hasKey)choices.push({icon:'🗝️',label:'Ouvrir avec la Clef Brisée',fn:()=>{
    G.inventory=G.inventory.filter(i=>i.id!=='k_broken');
    const pot=randFrom(ZONE1_POTIONS.slice(0,3));
    G.inventory.push({...pot});room.cleared=true;saveGD();
    evtResult('Vous trouvez : '+pot.icon+' '+pot.name,'heal');
  }});
  choices.push({icon:'🦴',label:'Fouiller les ossements',fn:()=>{
    room.cleared=true;
    if(Math.random()<.3){
      G.inventory.push({...ZONE1_KEYS[0]});saveGD();
      evtResult('Vous trouvez une Clef Brisée !','heal');
    } else {saveGD();evtResult('Rien d\'utile parmi les os.');}
  }});
  choices.push({label:'Partir',fn:()=>{showScreen(null);gameMode='explore';renderPanel();}});
  showEvt('💀','OSSUAIRE SCELLÉ','Des milliers d\'ossements. Un coffre trône au centre.',choices);
}

function evtChapel(room){
  const choices=[
    {icon:'🙏',label:'Prier (+15 HP)',fn:()=>{
      G.hp=Math.min(G.max_hp,G.hp+15);room.cleared=true;saveGD();
      evtResult('+15 HP récupérés.','heal');
    }},
    {label:`Offrande (5 âmes → +30 HP)`,fn:()=>{
      if((G.souls||0)<5){evtResult('Pas assez d\'âmes.','dmg');return;}
      G.souls-=5;G.hp=Math.min(G.max_hp,G.hp+30);room.cleared=true;saveGD();
      evtResult('+30 HP, −5 âmes.','heal');
    }},
    {label:'Partir',fn:()=>{showScreen(null);gameMode='explore';renderPanel();}},
  ];
  showEvt('🕯️','CHAPELLE OUBLIÉE','Un autel ancien. Une présence bienveillante dans les pierres.',choices);
}

function evtFountain(room){
  const choices=[
    {icon:'💧',label:'Boire (50% : +25 HP / 50% : −10 HP)',fn:()=>{
      room.cleared=true;
      if(Math.random()<.5){G.hp=Math.min(G.max_hp,G.hp+25);saveGD();evtResult('+25 HP !','heal');}
      else{G.hp=Math.max(1,G.hp-10);saveGD();evtResult('Eau corrompue. −10 HP.','dmg');}
    }},
    {label:'Partir',fn:()=>{showScreen(null);gameMode='explore';renderPanel();}},
  ];
  showEvt('💧','FONTAINE SOUTERRAINE','Une eau sombre et froide scintille faiblement.',choices);
}

function openInventory(){
  if(!G.inventory.length){showPaWarn();return;}
  const potions=G.inventory.filter(i=>i.effect);
  const choices=potions.map(pot=>({
    label:`${pot.icon} ${pot.name} — Utiliser`,
    fn:()=>{
      const idx=G.inventory.indexOf(pot);
      if(idx>=0)G.inventory.splice(idx,1);
      usePotion(pot);saveGD();
      showScreen(null);gameMode='explore';updateHUD();renderPanel();
    },
  }));
  choices.push({label:'Fermer',fn:()=>{showScreen(null);gameMode='explore';renderPanel();}});
  showEvt('🎒','INVENTAIRE',`${G.inventory.length} objet(s).`,choices);
}

// ═══════════════════════════════════════════════════════════════
// COMBAT
// ═══════════════════════════════════════════════════════════════
function startCombat(room){
  const eData=ZONE1_ENEMIES.find(e=>e.id===room.enemyId)||ZONE1_ENEMIES[0];
  currentCombat={room,enemy:{...eData,max_hp:eData.hp,cur_atk:eData.atk},
    turn:0,defending:false,poison:0,flee_blocked:false};
  gameMode='combat';
  document.getElementById('screen-combat').classList.add('active');
  document.getElementById('z1-panel').classList.add('hidden');
  updateCombatUI();
}

function startBoss(){
  const room=getRoom();
  currentCombat={room,
    enemy:{...ZONE1_BOSS,hp:ZONE1_BOSS.hp,max_hp:ZONE1_BOSS.hp,cur_atk:ZONE1_BOSS.atk_p1},
    turn:0,defending:false,poison:0,flee_blocked:false};
  gameMode='combat';
  document.getElementById('screen-combat').classList.add('active');
  document.getElementById('z1-panel').classList.add('hidden');
  updateCombatUI();
}

function updateCombatUI(){
  if(!currentCombat)return;
  const e=currentCombat.enemy;
  const pct=Math.max(0,(e.hp/e.max_hp)*100);
  document.getElementById('combat-enemy-name').textContent=e.name;
  document.getElementById('combat-hp-fill').style.width=pct+'%';
  document.getElementById('combat-hp-val').textContent=e.hp+' HP';
  const pa=G.pa||0;
  const acts=[
    {label:'ATTAQUER',icon:'⚔️',cost:2,fn:doAtk,disabled:pa<2},
    {label:'DÉFENDRE',icon:'🛡️',cost:1,fn:doDef,disabled:pa<1},
    {label:'OBJET',   icon:'🎒',cost:1,fn:doObj,disabled:pa<1||!G.inventory.filter(i=>i.effect).length},
    {label:'FUIR',    icon:'💨',cost:2,fn:doFlee,disabled:pa<2},
  ];
  const panel=document.getElementById('combat-actions');
  panel.innerHTML='';
  acts.forEach(a=>{
    const b=document.createElement('button');
    b.className='btn'+(a.disabled?' dim':'');
    b.innerHTML=`${a.icon} ${a.label}<span class="cost">${a.cost}⚡</span>`;
    if(!a.disabled)b.onclick=a.fn;
    panel.appendChild(b);
  });
}

function addLog(msg,type=''){
  const log=document.getElementById('combat-log');
  const d=document.createElement('div');
  d.className='log-line'+(type?' '+type:'');d.textContent=msg;
  log.appendChild(d);
  while(log.children.length>4)log.removeChild(log.firstChild);
}

function doAtk(){
  if(!spendPa(2))return;
  const e=currentCombat.enemy;
  let dmg=C.ATK_BASE;
  if(G.run_buffs.atk_pct)dmg=Math.round(dmg*(1+G.run_buffs.atk_pct));
  if(e.isBoss&&e.key_weakness&&G.inventory.some(i=>i.id===e.key_weakness))
    dmg=Math.round(dmg*(1+e.key_dmg_bonus));
  if(e.damage_reduction)dmg=Math.round(dmg*(1-e.damage_reduction));
  e.hp-=dmg;
  addLog(`Vous infligez ${dmg} dégâts.`);
  if(checkEnemyDead())return;
  enemyTurn();
}

function doDef(){
  if(!spendPa(1))return;
  currentCombat.defending=true;
  addLog('Vous vous défendez.');
  enemyTurn();
}

function doObj(){
  if(!spendPa(1))return;
  const pot=G.inventory.find(i=>i.effect);
  if(!pot){addLog('Aucun objet utilisable.');return;}
  const idx=G.inventory.indexOf(pot);G.inventory.splice(idx,1);
  usePotion(pot);saveGD();
  enemyTurn();
}

function doFlee(){
  if(!spendPa(2))return;
  const e=currentCombat.enemy;
  if(e.flee_block_once&&!currentCombat.flee_blocked){
    currentCombat.flee_blocked=true;
    const dmg=e.atk_on_flee_fail||e.atk||8;
    G.hp=Math.max(0,G.hp-dmg);saveGD();updateHUD();
    addLog(`Fuite bloquée ! −${dmg} HP.`,'dmg');
    if(G.hp<=0){combatDie();return;}
    updateCombatUI();return;
  }
  const bonus=G.run_buffs.flee_bonus||0;
  if(Math.random()<.55+bonus){
    addLog('Vous fuyez !');setTimeout(endFlee,600);
  } else {
    addLog('La fuite échoue !','dmg');enemyTurn();
  }
}

function usePotion(pot){
  if(pot.effect==='heal'){
    G.hp=Math.min(G.max_hp,G.hp+pot.value);
    addLog(`${pot.icon} +${pot.value} HP.`,'heal');
  } else if(pot.effect==='heal_risk'){
    if(Math.random()<(pot.fail_chance||.25)){
      G.hp=Math.max(1,G.hp+(pot.fail||-15));
      addLog(`${pot.icon} Raté ! ${pot.fail} HP.`,'dmg');
    } else {
      G.hp=Math.min(G.max_hp,G.hp+pot.value);
      addLog(`${pot.icon} +${pot.value} HP.`,'heal');
    }
  } else if(pot.effect==='buff_atk'){
    G.run_buffs.atk_pct=(G.run_buffs.atk_pct||0)+pot.value;
    addLog(`${pot.icon} ATK +${Math.round(pot.value*100)}%.`,'heal');
  } else if(pot.effect==='buff_flee'){
    G.run_buffs.flee_bonus=(G.run_buffs.flee_bonus||0)+pot.value;
    addLog(`${pot.icon} Fuite améliorée.`,'heal');
  }
  updateHUD();
}

function enemyTurn(){
  if(!currentCombat)return;
  const e=currentCombat.enemy;
  currentCombat.turn++;
  // Boss phase ATK
  if(e.isBoss){
    const pct=e.hp/e.max_hp;
    e.cur_atk=pct>0.66?e.atk_p1:pct>0.33?e.atk_p2:e.atk_p3;
  }
  // Sentinel slow
  if(e.slow_attack&&currentCombat.turn%2===1){
    addLog('La Sentinelle se prépare...');
    currentCombat.defending=false;updateCombatUI();return;
  }
  // Shadow ATK grow
  if(e.atk_grow_per_turn)e.cur_atk=(e.cur_atk||e.atk)+e.atk_grow_per_turn;
  let dmg=e.cur_atk||e.atk||8;
  if(currentCombat.defending)dmg=Math.ceil(dmg*.5);
  currentCombat.defending=false;
  // Poison
  if(currentCombat.poison){
    G.hp=Math.max(0,G.hp-currentCombat.poison);
    addLog(`Poison −${currentCombat.poison} HP.`,'dmg');
  }
  if(e.poison_per_turn)currentCombat.poison=(currentCombat.poison||0)+e.poison_per_turn;
  G.hp=Math.max(0,G.hp-dmg);
  addLog(`${e.name} : −${dmg} HP.`,'dmg');
  // Boss double
  if(e.isBoss&&e.hp/e.max_hp<0.66&&Math.random()<(e.double_chance_p2||0)){
    G.hp=Math.max(0,G.hp-e.cur_atk);
    addLog(`Double frappe ! −${e.cur_atk} HP !`,'dmg');
  }
  // Scavenger steal
  if(e.steal_potion_chance&&Math.random()<e.steal_potion_chance&&G.inventory.length){
    const s=G.inventory.pop();addLog(`Vol : ${s.icon||'?'} ${s.name} !`,'dmg');
  }
  saveGD();updateHUD();
  if(G.hp<=0){combatDie();return;}
  updateCombatUI();
}

function checkEnemyDead(){
  const e=currentCombat.enemy;
  if(e.hp>0)return false;
  if(currentCombat.room){
    currentCombat.room.cleared=true;
    if(e.soul_drop&&Math.random()<(e.soul_chance||.5))G.souls=(G.souls||0)+e.soul_drop;
    if(e.isBoss)G.souls=(G.souls||0)+(e.souls||0);
  }
  addLog(`${e.name} vaincu !`,'heal');
  saveGD();
  setTimeout(endCombatWin,800);
  return true;
}

function endCombatWin(){
  exitCombat();gameMode='explore';renderPanel();updateHUD();
}
function endFlee(){
  const room=getRoom();
  if(room?.connections?.length)G.current_room=room.connections[0];
  saveGD();exitCombat();gameMode='explore';renderPanel();updateHUD();
}
function combatDie(){exitCombat();triggerDeath('Vous êtes tombé au combat.');}
function exitCombat(){
  document.getElementById('screen-combat').classList.remove('active');
  document.getElementById('z1-panel').classList.remove('hidden');
  document.getElementById('combat-log').innerHTML='';
  currentCombat=null;
}

// ═══════════════════════════════════════════════════════════════
// DEATH
// ═══════════════════════════════════════════════════════════════
function triggerDeath(msg){
  gameMode='dead';
  document.getElementById('death-text').textContent=msg;
  document.getElementById('death-souls').textContent=(G.souls||0)?`Âmes conservées : ${G.souls}`:'';
  showScreen('death');
}

function onDeathContinue(){
  const kept={souls:G.souls||0,total_runs:(G.total_runs||0)+1};
  G.hp=C.HP_MAX;G.floor=1;G.floor_layout=null;G.current_room=null;
  G.rooms_visited=[];G.inventory=[];G.run_buffs={};
  Object.assign(G,kept);
  generateFloor();saveG();
  currentCombat=null;gameMode='explore';
  showScreen(null);updateHUD();renderPanel();
}

// ═══════════════════════════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════════════════════════
function renderPanel(){
  if(gameMode!=='explore')return;
  const room=getRoom();
  if(!room){document.getElementById('z1-panel').classList.remove('hidden');return;}
  const meta=ROOM_META[room.type]||ROOM_META.corridor;
  document.getElementById('panel-room-type').textContent=meta.label;
  document.getElementById('panel-room-desc').textContent=meta.desc;
  const choicesEl=document.getElementById('panel-choices');
  choicesEl.innerHTML='';
  const pa=G.pa||0;
  const choices=[];

  if(room.type==='exit'){
    choices.push({label:'DESCENDRE AU NIVEAU '+(G.floor+1),icon:'🔻',cost:1,disabled:pa<1,fn:advanceFloor});
  } else if((room.type==='guarded'||room.type==='boss')&&!room.cleared){
    choices.push({label:room.type==='boss'?'AFFRONTER LE GARDIEN':'AFFRONTER L\'ENNEMI',
      icon:room.type==='boss'?'👁️':'⚔️',cost:2,disabled:pa<2,
      fn:()=>room.type==='boss'?startBoss():startCombat(room)});
  } else if(['ossuary','chapel','fountain'].includes(room.type)&&!room.cleared){
    choices.push({label:'EXPLORER',icon:meta.icon,cost:0,fn:()=>triggerRoom(room)});
  } else if(room.type==='merchant'){
    ZONE1_POTIONS.slice(0,3).forEach(pot=>{
      const canBuy=(G.souls||0)>=pot.price;
      choices.push({label:`${pot.icon} ${pot.name}`,sub:`${pot.price} âmes`,disabled:!canBuy,fn:()=>{
        if((G.souls||0)<pot.price)return;
        G.souls-=pot.price;G.inventory.push({...pot});saveGD();updateHUD();renderPanel();
      }});
    });
  }

  // Navigation to adjacent rooms
  const adj=(room.connections||[]).map(id=>getRoomById(id)).filter(Boolean);
  adj.forEach(r=>{
    const visited=G.rooms_visited.includes(r.id);
    const rm=ROOM_META[r.type]||ROOM_META.corridor;
    choices.push({label:`↦ ${visited?rm.label:'???'}`,icon:visited?rm.icon:'🌑',
      cost:1,disabled:pa<1,fn:()=>moveToRoom(r.id)});
  });

  // Inventory
  if(G.inventory.length)
    choices.push({label:`🎒 INVENTAIRE (${G.inventory.length})`,cost:0,fn:openInventory});

  choices.forEach(ch=>{
    const b=document.createElement('button');
    b.className='btn'+(ch.disabled?' dim':ch.cost===0?' primary':'');
    let html='';
    if(ch.icon)html+=`<span>${ch.icon}</span> `;
    html+=`<span>${ch.label}</span>`;
    if(ch.sub)html+=`<span class="cost">${ch.sub}</span>`;
    else if(ch.cost)html+=`<span class="cost">${ch.cost}⚡</span>`;
    b.innerHTML=html;
    if(!ch.disabled)b.onclick=ch.fn;
    choicesEl.appendChild(b);
  });

  document.getElementById('z1-panel').classList.remove('hidden');
}

function updateHUD(){
  if(!G)return;

// ═══════════════════════════════════════════════════════════════
// CANVAS — CORRIDOR RENDERER
// ═══════════════════════════════════════════════════════════════
function resizeCvs(){
  const c=document.getElementById('cvs');
  c.width=window.innerWidth;c.height=window.innerHeight;
}

function drawScene(ts=0){
  requestAnimationFrame(drawScene);
  const cvs=document.getElementById('cvs');
  if(!cvs)return;
  const ctx=cvs.getContext('2d');
  const W=cvs.width,H=cvs.height;
  torchPhase=ts*.003;
  ctx.clearRect(0,0,W,H);

  if(!G){
    ctx.fillStyle='#04030a';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(200,180,140,.4)';ctx.font='11px Cinzel,serif';ctx.textAlign='center';
    ctx.fillText('CHARGEMENT…',W/2,H/2);ctx.textAlign='left';
    return;
  }

  const room=getRoom();
  const rType=room?room.type:'corridor';
  const inCombat=gameMode==='combat'&&currentCombat;

  // Perspective anchors
  const vpx=W*.5;
  const vpy=Math.round(H*.27);
  const heroFeetY=Math.round(H*.68);
  const bossFootY=Math.round(vpy+(heroFeetY-vpy)*.52);

  const lwTop=Math.round(W*.18),rwTop=Math.round(W*.82);
  const lwBot=0,rwBot=W;

  function wEdge(side,y){
    const t=Math.max(0,Math.min(1,(y-vpy)/(H-vpy)));
    return side==='L'?Math.round(lwTop+(lwBot-lwTop)*t):Math.round(rwTop+(rwBot-rwTop)*t);
  }

  // ── BG ──────────────────────────────────────────────────────
  const bgG=ctx.createLinearGradient(0,0,0,H);
  bgG.addColorStop(0,'#04030a');bgG.addColorStop(.35,'#0e0a1e');bgG.addColorStop(1,'#07060e');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);

  // ── CEILING ─────────────────────────────────────────────────
  ctx.fillStyle='#06040e';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(lwTop,vpy);ctx.lineTo(rwTop,vpy);ctx.lineTo(W,0);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(90,60,150,.10)';ctx.lineWidth=1.5;
  [W*.16,W*.34,W*.5,W*.66,W*.84].forEach(ox=>{
    ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(lwTop,vpy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(rwTop,vpy);ctx.stroke();
  });
  const cg=ctx.createLinearGradient(0,0,0,vpy);
  cg.addColorStop(0,'rgba(0,0,0,.72)');cg.addColorStop(1,'transparent');
  ctx.fillStyle=cg;ctx.fillRect(0,0,W,vpy);

  // ── LEFT WALL ───────────────────────────────────────────────
  {const g=ctx.createLinearGradient(0,0,lwTop,0);
  g.addColorStop(0,'#04030a');g.addColorStop(1,'#14102a');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(lwTop,vpy);ctx.lineTo(lwBot,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  const bkH=18;
  for(let r=0;r*bkH<H;r++){
    const y=r*bkH,re=wEdge('L',y);if(re<=0)break;
    const off=(r%2)*26,bw=Math.max(14,re*.40);
    for(let bx=off-bw;bx<re;bx+=bw){
      const tn=(r*11+Math.round(bx/bw)*7)%100;
      ctx.fillStyle=`rgba(255,255,255,${tn<35?.007:.014})`;
      ctx.fillRect(Math.max(0,bx+1),y+1,Math.min(bw-2,re-Math.max(0,bx)-1),bkH-2);
      ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=.5;
      ctx.strokeRect(Math.max(0,bx),y,Math.min(bw,re-Math.max(0,bx)),bkH);
    }
  }
  const lsh=ctx.createLinearGradient(lwTop,0,lwTop-28,0);
  lsh.addColorStop(0,'rgba(0,0,0,.58)');lsh.addColorStop(1,'transparent');
  ctx.fillStyle=lsh;
  ctx.beginPath();ctx.moveTo(lwTop,vpy);ctx.lineTo(lwTop-28,vpy);ctx.lineTo(0,H);ctx.closePath();ctx.fill();}

  // ── RIGHT WALL ──────────────────────────────────────────────
  {const g=ctx.createLinearGradient(rwTop,0,W,0);
  g.addColorStop(0,'#14102a');g.addColorStop(1,'#04030a');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(rwTop,vpy);ctx.lineTo(rwBot,H);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  const bkH=18;
  for(let r=0;r*bkH<H;r++){
    const y=r*bkH,le=wEdge('R',y);if(le>=W)break;
    const off=(r%2)*26,bw=Math.max(14,(W-le)*.40);
    for(let bx=le+off;bx<W;bx+=bw){
      const tn=(r*13+Math.round((bx-le)/bw)*11)%100;
      ctx.fillStyle=`rgba(255,255,255,${tn<35?.007:.014})`;
      ctx.fillRect(bx+1,y+1,Math.min(bw-2,W-bx-1),bkH-2);
      ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=.5;
      ctx.strokeRect(bx,y,Math.min(bw,W-bx),bkH);
    }
  }
  const rsh=ctx.createLinearGradient(rwTop,0,rwTop+28,0);
  rsh.addColorStop(0,'rgba(0,0,0,.58)');rsh.addColorStop(1,'transparent');
  ctx.fillStyle=rsh;
  ctx.beginPath();ctx.moveTo(rwTop,vpy);ctx.lineTo(rwTop+28,vpy);ctx.lineTo(W,H);ctx.closePath();ctx.fill();}

  // ── FLOOR ───────────────────────────────────────────────────
  {const fg=ctx.createLinearGradient(0,vpy,0,H);
  fg.addColorStop(0,'#0f0d20');fg.addColorStop(1,'#06050f');
  ctx.fillStyle=fg;
  ctx.beginPath();ctx.moveTo(lwTop,vpy);ctx.lineTo(rwTop,vpy);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=.5;
  for(let y=vpy;y<H;y+=22){
    const xl=wEdge('L',y),xr=wEdge('R',y);
    ctx.beginPath();ctx.moveTo(xl,y);ctx.lineTo(xr,y);ctx.stroke();
  }
  ctx.strokeStyle='rgba(70,50,110,.10)';ctx.lineWidth=1;
  [.28,.38,.5,.62,.72].forEach(f=>{
    ctx.beginPath();ctx.moveTo(vpx,vpy);ctx.lineTo(f*W,H);ctx.stroke();
  });}

  // ── TORCHES ─────────────────────────────────────────────────
  const ty=Math.round(vpy+(heroFeetY-vpy)*.36);
  const tlx=wEdge('L',ty)+10;
  const trx=wEdge('R',ty)-10;
  drawTorch(ctx,tlx,ty,ts);drawTorch(ctx,trx,ty,ts);
  [{x:tlx},{x:trx}].forEach(({x})=>{
    const gl=ctx.createRadialGradient(x,ty,2,x,ty,65);
    gl.addColorStop(0,'rgba(255,155,45,.12)');gl.addColorStop(1,'transparent');
    ctx.fillStyle=gl;ctx.fillRect(x-65,ty-65,130,130);
  });

  // ── ROOM CONTENT ────────────────────────────────────────────
  drawRoomContent(ctx,W,H,vpx,vpy,heroFeetY,bossFootY,inCombat?'guarded':rType,ts,ZONE1);

  // ── HERO ────────────────────────────────────────────────────
  if(!inCombat){
    const sc=3;
    const sw=HERO_SPR[0].length*sc,sh=HERO_SPR.length*sc;
    drawPxSkin(ctx,HERO_SPR,Math.round(vpx-sw/2),Math.round(heroFeetY-sh),sc,PX);
  }

  // ── FLOOR LABEL ─────────────────────────────────────────────
  ctx.font='9px Cinzel,serif';ctx.textAlign='center';
  ctx.fillStyle='rgba(180,155,100,.18)';
  ctx.fillText('ÉTAGE '+(G.floor||1)+' — '+ZONE1.name,vpx,vpy-10);
  ctx.textAlign='left';
}

function drawTorch(ctx,tx,ty,ts){
  const fl=Math.sin(ts*.009+tx*.01)*.35+.65;
  ctx.fillStyle='#3a2810';ctx.fillRect(tx-2,ty-4,4,10);
  ctx.fillStyle=`rgba(255,200,60,${.88*fl})`;
  ctx.beginPath();ctx.ellipse(tx,ty-9*fl,3.5,7*fl,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=`rgba(255,100,10,${.65*fl})`;
  ctx.beginPath();ctx.ellipse(tx+1,ty-5*fl,2,4.5*fl,-.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,200,.95)';
  ctx.beginPath();ctx.arc(tx,ty-8*fl,1.8,0,Math.PI*2);ctx.fill();
}

function drawRoomContent(ctx,W,H,vpx,vpy,heroFeetY,bossFootY,type,ts,zone){
  const cx=vpx,cy=Math.round(vpy+(bossFootY-vpy)*.55);
  if(type==='guarded'||type==='boss'){
    const e=currentCombat?.enemy;
    const hpPct=e?(e.hp/e.max_hp):1;
    const fl=Math.sin(ts*.003)*.05+.95;
    const ag=ctx.createRadialGradient(cx,cy,10,cx,cy,80);
    ag.addColorStop(0,`rgba(200,20,20,${.32*fl})`);ag.addColorStop(.5,`rgba(140,8,8,${.14*fl})`);ag.addColorStop(1,'transparent');
    ctx.fillStyle=ag;ctx.fillRect(cx-100,cy-100,200,200);
    const eId=e?.id||'';
    if(type==='boss'||eId==='boss_guardian')drawBossGuardian(ctx,cx,cy-40,ts,hpPct);
    else drawEnemy(ctx,cx,cy-20,ts,eId,hpPct);
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.beginPath();ctx.ellipse(cx,bossFootY,type==='boss'?70:44,8,0,0,Math.PI*2);ctx.fill();
  } else if(type==='ossuary'){drawOssuary(ctx,W,H,vpx,vpy,bossFootY,ts);
  } else if(type==='chapel'){drawChapel(ctx,W,H,vpx,vpy,bossFootY,ts,zone);
  } else if(type==='fountain'){drawFountain(ctx,W,H,vpx,vpy,bossFootY,ts);
  } else if(type==='merchant'){drawMerchant(ctx,W,H,vpx,vpy,bossFootY,ts);
  } else if(type==='exit'||type==='antechamber'){drawExit(ctx,W,H,vpx,vpy,bossFootY,ts,zone);
  } else if(type==='junction'){drawJunction(ctx,W,H,vpx,vpy,bossFootY,ts);
  } else {drawCorridor(ctx,W,H,vpx,vpy,bossFootY,ts,zone);}
}

function drawEnemy(ctx,cx,cy,ts,id,hpPct){
  const bob=Math.sin(ts*.003)*3;cy+=bob;
  const PAL={
    e_bone:    {body:'#c8b89a',eye:'#ff4040',glow:'rgba(200,180,150,'},
    e_spectre: {body:'#8888cc',eye:'#ffffff', glow:'rgba(100,100,200,'},
    e_shadow:  {body:'#222233',eye:'#cc44ff', glow:'rgba(80,0,120,'},
    e_sentinel:{body:'#6a6a88',eye:'#ffcc00', glow:'rgba(100,100,140,'},
    e_scavenger:{body:'#886644',eye:'#ff8800',glow:'rgba(140,100,60,'},
    e_worm:    {body:'#446633',eye:'#88ff44', glow:'rgba(60,120,40,'},
  };
  const p=PAL[id]||{body:'#888899',eye:'#ff6060',glow:'rgba(130,130,160,'};
  const hp=Math.max(0,hpPct);
  const ag=ctx.createRadialGradient(cx,cy,5,cx,cy,55);
  ag.addColorStop(0,p.glow+(0.28*hp).toFixed(2)+')');ag.addColorStop(1,'transparent');
  ctx.fillStyle=ag;ctx.fillRect(cx-58,cy-58,116,116);
  ctx.save();ctx.translate(cx,cy);
  if(id==='e_bone'){
    ctx.fillStyle=p.body;ctx.fillRect(-10,-40,20,22);
    ctx.beginPath();ctx.arc(0,-48,12,0,Math.PI*2);ctx.fillStyle='#d0c0a0';ctx.fill();
    ctx.fillStyle=p.body;ctx.fillRect(-15,-18,8,28);ctx.fillRect(7,-18,8,28);
    ctx.fillRect(-22,-40,8,18);ctx.fillRect(14,-40,8,18);
    ctx.fillStyle=p.eye;ctx.fillRect(-5,-51,4,4);ctx.fillRect(2,-51,4,4);
    ctx.fillStyle='#222';ctx.fillRect(-6,-43,14,3);
  } else if(id==='e_spectre'){
    const wave=Math.sin(ts*.004)*3;ctx.globalAlpha=.7+hp*.3;
    ctx.fillStyle=p.body;ctx.beginPath();ctx.arc(0,-35,18,Math.PI,0);
    ctx.lineTo(18,-35+wave);
    for(let i=0;i<4;i++)ctx.quadraticCurveTo(18-i*9,wave+(i%2?8:-8),-18+i*9*2,wave);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=p.eye;
    ctx.beginPath();ctx.arc(-7,-38,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(7,-38,4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  } else if(id==='e_shadow'){
    ctx.globalAlpha=.6+hp*.4;
    const sg=ctx.createRadialGradient(0,-20,2,0,-20,30);
    sg.addColorStop(0,p.body);sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(0,-20,28,36,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=p.eye;
    ctx.beginPath();ctx.ellipse(-8,-22,5,3,-.3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(8,-22,5,3,.3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  } else if(id==='e_sentinel'){
    ctx.fillStyle=p.body;ctx.fillRect(-18,-52,36,52);
    ctx.fillRect(-22,-52,8,52);ctx.fillRect(14,-52,8,52);
    ctx.fillRect(-14,-64,28,20);
    ctx.fillStyle=p.eye;ctx.fillRect(-10,-58,8,4);ctx.fillRect(2,-58,8,4);
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-5,-40);ctx.lineTo(3,-20);ctx.lineTo(-2,-5);ctx.stroke();
  } else if(id==='e_scavenger'){
    ctx.fillStyle=p.body;ctx.beginPath();ctx.ellipse(0,-25,16,22,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#664422';ctx.fillRect(-8,-48,16,14);
    ctx.fillStyle=p.eye;ctx.fillRect(-5,-46,4,4);ctx.fillRect(1,-46,4,4);
    ctx.fillStyle='#775533';
    ctx.beginPath();ctx.ellipse(-22,-30,10,20,-.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(22,-30,10,20,.4,0,Math.PI*2);ctx.fill();
  } else if(id==='e_worm'){
    ctx.fillStyle=p.body;
    for(let i=0;i<5;i++){
      const wx=Math.sin(ts*.003+i*.6)*8;
      ctx.beginPath();ctx.ellipse(wx,-i*12,12-i,12-i,0,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle=p.eye;
    const wx0=Math.sin(ts*.003)*8;
    ctx.beginPath();ctx.arc(wx0-4,-50,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(wx0+4,-50,3,0,Math.PI*2);ctx.fill();
  } else {
    ctx.fillStyle=p.body;ctx.beginPath();ctx.ellipse(0,-25,18,28,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=p.eye;
    ctx.beginPath();ctx.arc(-6,-28,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(6,-28,4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawBossGuardian(ctx,cx,cy,ts,hpPct){
  const bob=Math.sin(ts*.002)*4;
  const phase=hpPct>0.66?1:hpPct>0.33?2:3;
  ctx.save();ctx.translate(cx,cy+bob);ctx.scale(1.8,1.8);
  const auras=['rgba(100,60,200,','rgba(200,80,20,','rgba(220,20,20,'];
  const ag=ctx.createRadialGradient(0,0,8,0,0,70);
  ag.addColorStop(0,auras[phase-1]+(0.4*(4-phase)/3+.15).toFixed(2)+')');ag.addColorStop(1,'transparent');
  ctx.fillStyle=ag;ctx.fillRect(-75,-90,150,130);
  ctx.fillStyle=phase===3?'#300808':phase===2?'#1a0a0a':'#0e0818';
  ctx.beginPath();ctx.moveTo(-30,-60);ctx.lineTo(-38,20);ctx.lineTo(38,20);ctx.lineTo(30,-60);ctx.closePath();ctx.fill();
  ctx.fillStyle=phase===3?'#442222':phase===2?'#2a1a22':'#1c1428';
  ctx.fillRect(-18,-60,36,56);ctx.fillRect(-24,-60,10,56);ctx.fillRect(14,-60,10,56);
  ctx.fillStyle='#111118';ctx.fillRect(-14,-82,28,28);
  ctx.fillStyle=phase===3?'#ff2200':phase===2?'#ff6600':'#8844ff';
  ctx.fillRect(-10,-78,20,4);
  const ep=Math.sin(ts*.004)*.5+.5;
  ctx.fillStyle=phase===3?`rgba(255,50,0,${.7+ep*.3})`:`rgba(180,100,255,${.6+ep*.4})`;
  ctx.beginPath();ctx.arc(-5,-72,3+ep,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(5,-72,3+ep,0,Math.PI*2);ctx.fill();
  if(phase>=2){
    ctx.fillStyle='#334455';ctx.fillRect(24,-70,8,80);
    ctx.fillStyle=phase===3?'#ff2200':'#6688aa';
    ctx.beginPath();ctx.moveTo(28,-70);ctx.lineTo(18,-90);ctx.lineTo(38,-90);ctx.closePath();ctx.fill();
  }
  if(phase===3){
    ctx.strokeStyle=`rgba(255,50,0,${.4+ep*.5})`;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,-30,45+ep*8,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

function drawOssuary(ctx,W,H,vpx,vpy,bossFootY,ts){
  const by=bossFootY;
  [{x:vpx-55,y:by-18,r:14},{x:vpx,y:by-22,r:17},{x:vpx+50,y:by-15,r:12},
   {x:vpx-28,y:by-40,r:11},{x:vpx+25,y:by-38,r:10}].forEach(({x,y,r})=>{
    ctx.fillStyle='#c0a878';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(x-r*.25,y-r*.15,r*.22,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+r*.25,y-r*.15,r*.22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#9a8462';ctx.fillRect(x-r*.35,y+r*.2,r*.7,r*.35);
  });
  [[vpx-80,by-5],[vpx+70,by-8],[vpx-40,by+5],[vpx+30,by+3]].forEach(([bx,bby])=>{
    ctx.save();ctx.translate(bx,bby);ctx.rotate(Math.sin(bx*.1)*.4);
    ctx.fillStyle='#b89870';ctx.fillRect(-20,-3,40,6);
    ctx.beginPath();ctx.arc(-20,0,5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(20,0,5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  const glow=ctx.createRadialGradient(vpx,by-30,5,vpx,by-30,80);
  glow.addColorStop(0,`rgba(140,60,180,${.12+Math.sin(ts*.002)*.05})`);glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;ctx.fillRect(vpx-90,by-110,180,120);
}

function drawChapel(ctx,W,H,vpx,vpy,bossFootY,ts,zone){
  const ay=bossFootY-10,aw=60,ah=35;
  ctx.fillStyle='#2a1f3a';ctx.fillRect(vpx-aw/2,ay-ah,aw,ah);
  ctx.fillStyle='#3c2c52';ctx.fillRect(vpx-aw/2-4,ay-ah-6,aw+8,8);
  ctx.strokeStyle=zone.color+'88';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(vpx,ay-ah/2,10,0,Math.PI*2);ctx.stroke();
  [[vpx-22,ay-ah],[vpx,ay-ah],[vpx+22,ay-ah]].forEach(([cx,cy])=>{
    const fl=Math.sin(ts*.006+cx*.01)*.3+.7;
    ctx.fillStyle='#c8b090';ctx.fillRect(cx-3,cy-20,6,20);
    const fg=ctx.createRadialGradient(cx,cy-22,1,cx,cy-22,18);
    fg.addColorStop(0,`rgba(255,200,60,${.8*fl})`);fg.addColorStop(.5,`rgba(255,100,20,${.32*fl})`);fg.addColorStop(1,'transparent');
    ctx.fillStyle=fg;ctx.fillRect(cx-18,cy-42,36,28);
    ctx.fillStyle=`rgba(255,200,80,${.88*fl})`;
    ctx.beginPath();ctx.ellipse(cx,cy-24*fl,3.5,6*fl,0,0,Math.PI*2);ctx.fill();
  });
}

function drawFountain(ctx,W,H,vpx,vpy,bossFootY,ts){
  const fy=bossFootY-5;
  ctx.fillStyle='#1a2234';ctx.beginPath();ctx.ellipse(vpx,fy,44,16,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2a3448';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(vpx,fy,44,16,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#2a2840';ctx.fillRect(vpx-6,fy-50,12,46);
  const wave=Math.sin(ts*.004)*.5+.5;
  ctx.fillStyle=`rgba(40,120,200,${.4+wave*.2})`;ctx.beginPath();ctx.ellipse(vpx,fy+2,38,12,0,0,Math.PI*2);ctx.fill();
  for(let i=0;i<5;i++){
    const t=(ts*.002+i*.4)%1,dx=Math.sin(i*1.8)*18,dy=fy-50+t*50;
    ctx.fillStyle=`rgba(80,160,220,${.6*(1-t)})`;ctx.beginPath();ctx.arc(vpx+dx,dy,2,0,Math.PI*2);ctx.fill();
  }
}

function drawMerchant(ctx,W,H,vpx,vpy,bossFootY,ts){
  const my=bossFootY,bob=Math.sin(ts*.0015)*2;
  ctx.fillStyle='#1a1428';
  ctx.beginPath();ctx.moveTo(vpx-25,my);ctx.quadraticCurveTo(vpx-30,my-60,vpx,my-80+bob);
  ctx.quadraticCurveTo(vpx+30,my-60,vpx+25,my);ctx.closePath();ctx.fill();
  ctx.fillStyle='#221836';ctx.beginPath();ctx.arc(vpx,my-80+bob,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=`rgba(255,200,50,${.5+Math.sin(ts*.004)*.3})`;
  ctx.beginPath();ctx.arc(vpx-7,my-82+bob,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(vpx+7,my-82+bob,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2a1e10';ctx.fillRect(vpx-35,my-18,70,14);
  ctx.fillStyle='#1a1008';ctx.fillRect(vpx-38,my-4,76,6);
  ctx.font='11px serif';ctx.textAlign='center';
  ['🧪','⚗️','🗝️'].forEach((e,i)=>ctx.fillText(e,vpx-18+i*18,my-20));
  ctx.textAlign='left';
}

function drawExit(ctx,W,H,vpx,vpy,bossFootY,ts,zone){
  const ex=vpx,ey=vpy+(bossFootY-vpy)*.5;
  const pulse=Math.sin(ts*.002)*.15+.25;
  const glow=ctx.createRadialGradient(ex,ey+20,5,ex,ey+20,90);
  glow.addColorStop(0,`rgba(255,200,80,${pulse})`);glow.addColorStop(.5,`rgba(180,130,30,${pulse*.4})`);glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;ctx.fillRect(ex-100,ey-60,200,120);
  for(let i=0;i<5;i++){
    const w=28+i*16,sy=ey-18+i*13;
    ctx.fillStyle=`rgba(38,32,58,${.6+i*.08})`;ctx.fillRect(ex-w/2,sy,w,11);
    ctx.strokeStyle='rgba(200,180,255,.13)';ctx.lineWidth=.5;ctx.strokeRect(ex-w/2,sy,w,11);
  }
  const ay=Math.sin(ts*.004)*4;
  ctx.fillStyle=`rgba(255,210,80,${.5+pulse})`;
  ctx.beginPath();ctx.moveTo(ex,ey+5+ay);ctx.lineTo(ex-9,ey-9+ay);ctx.lineTo(ex+9,ey-9+ay);ctx.closePath();ctx.fill();
}

function drawJunction(ctx,W,H,vpx,vpy,bossFootY,ts){
  const oy=vpy+(bossFootY-vpy)*.4;
  const ag1=ctx.createLinearGradient(vpx*.3,oy,vpx*.52,oy);
  ag1.addColorStop(0,'rgba(28,18,48,.65)');ag1.addColorStop(1,'transparent');
  ctx.fillStyle=ag1;ctx.fillRect(0,oy-32,vpx*.42,64);
  ctx.strokeStyle='rgba(100,78,140,.28)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(vpx*.36,oy-32);ctx.lineTo(vpx*.36,oy+32);ctx.stroke();
  const ag2=ctx.createLinearGradient(vpx*1.48,oy,W,oy);
  ag2.addColorStop(0,'transparent');ag2.addColorStop(1,'rgba(28,18,48,.65)');
  ctx.fillStyle=ag2;ctx.fillRect(vpx*.58,oy-32,W-vpx*.58,64);
  ctx.strokeStyle='rgba(100,78,140,.28)';
  ctx.beginPath();ctx.moveTo(vpx*1.64,oy-32);ctx.lineTo(vpx*1.64,oy+32);ctx.stroke();
}

function drawCorridor(ctx,W,H,vpx,vpy,bossFootY,ts,zone){
  const sp=Math.sin(ts*.002)*.5+.5;
  const sy=Math.round(vpy+(bossFootY-vpy)*.42);
  const sr=Math.round(W*.13);
  const hex=n=>Math.round(n*255).toString(16).padStart(2,'0');
  const sg=ctx.createRadialGradient(vpx,sy,4,vpx,sy,sr);
  sg.addColorStop(0,zone.color+hex(.07+sp*.12));
  sg.addColorStop(.55,zone.color+hex(.03+sp*.06));
  sg.addColorStop(1,'transparent');
  ctx.fillStyle=sg;ctx.fillRect(vpx-sr-12,sy-sr-12,sr*2+24,sr*2+24);
  ctx.strokeStyle=zone.color+hex(.13+sp*.17);ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(vpx,sy,sr*.58,0,Math.PI*2);ctx.stroke();
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3+ts*.00016;
    ctx.beginPath();
    ctx.moveTo(vpx+Math.cos(a)*sr*.28,sy+Math.sin(a)*sr*.28);
    ctx.lineTo(vpx+Math.cos(a)*sr*.58,sy+Math.sin(a)*sr*.58);
    ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
async function init(){
  resizeCvs();
  window.addEventListener('resize',resizeCvs);
  requestAnimationFrame(drawScene);

  // Steps realtime subscription
  db.channel('steps-rt').on('postgres_changes',{event:'*',schema:'public',table:'steps_log'},async()=>{
    const t=today();
    const{data}=await db.from('steps_log').select('steps').gte('date',t).lte('date',t+'z').maybeSingle();
    stepsToday=data?.steps||0;
    checkNewDay();updatePaFromSteps();updateHUD();
  }).subscribe();

  // Initial step count
  try{
    const t=today();
    const{data}=await db.from('steps_log').select('steps').gte('date',t).lte('date',t+'z').maybeSingle();
    stepsToday=data?.steps||0;
  }catch(e){}

  await fetchAll();
  setInterval(()=>{if(G)checkNight();},60000);
}

// Expose globals needed by inline onclick
window.onNightContinue=onNightContinue;
window.onDeathContinue=onDeathContinue;

init();
</script>
