<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Courses V2">
<title>Courses V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #ffffff; --card: #ffffff; --card-2: #f0f6ff; --line: rgba(37,99,235,.10);
    --text: #16305c; --muted: #6b7fa3; --faint: #a9b8d3;
    --accent: #10b981; --accent-bg: #e3f9ef; --accent-ink: #047857;
    --blue: #2f7cf6; --blue-bg: #e8f1ff; --blue-ink: #1d4fb3;
    --danger: #ef4444; --shadow: 0 1px 2px rgba(37,99,235,.05), 0 8px 24px rgba(37,99,235,.08);
    --grad: linear-gradient(135deg, #2f7cf6 0%, #10b981 100%);
    --r: 16px; --tab-h: calc(64px + env(safe-area-inset-bottom, 0px));
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, system-ui, sans-serif; font-size: 16px; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ── Écrans ── */
  .screen { display: none; min-height: 100%; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(var(--tab-h) + 24px); }
  .screen.active { display: block; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 0 14px; }
  .head h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .progress h1 { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .head .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }

  /* ── Recherche ── */
  .search { display: flex; align-items: center; gap: 10px; background: var(--card-2); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .search input { flex: 1; border: 0; outline: 0; background: none; font-size: 16px; }
  .search input::placeholder { color: var(--faint); }
  .search .clear { color: var(--faint); font-size: 18px; padding: 4px; }

  /* ── Tuiles produits ── */
  .section { margin-bottom: 22px; }
  .section-title { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (min-width: 420px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .tile { position: relative; background: var(--card-2); border-radius: var(--r); box-shadow: none !important; padding: 12px 8px 10px; text-align: center; box-shadow: var(--shadow); border: 2px solid transparent; transition: transform .12s, background .15s, border-color .15s; min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .tile:active { transform: scale(.94); }
  .tile .emoji { font-size: 26px; line-height: 1; }
  .mono { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; font-size: 12px !important; font-weight: 800; letter-spacing: -.01em; border: 1px solid rgba(0,0,0,.08); font-family: 'Inter', sans-serif; line-height: 1; }
  .row .mono, .item .mono { width: 30px; height: 30px; font-size: 11px !important; }
  .tile .name { font-size: 12.5px; font-weight: 500; line-height: 1.2; }
  .tile.on { background: var(--accent-bg); border-color: var(--accent); }
  .tile.on .name { color: var(--accent-ink); font-weight: 600; }
  .tile .qty { position: absolute; top: -7px; right: -7px; min-width: 26px; height: 26px; border-radius: 13px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; display: none; align-items: center; justify-content: center; padding: 0 7px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .tile.on .qty { display: flex; }
  .tile.add { border: 2px dashed var(--line); background: transparent; box-shadow: none; color: var(--muted); }
  .tile.add .emoji { font-size: 22px; }
  .tile.pop { animation: pop .25s ease; }
  @keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }

  /* ── Barre flottante liste ── */
  .float { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tab-h) + 12px); background: var(--grad); color: #fff; border-radius: 18px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,.25); transform: translateY(20px); opacity: 0; pointer-events: none; transition: transform .25s, opacity .25s; z-index: 20; }
  .float.show { transform: none; opacity: 1; pointer-events: all; }
  .float b { font-weight: 700; }
  .float .go { background: rgba(255,255,255,.22); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; }

  /* ── Liste ── */
  .row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 12px 12px 14px; box-shadow: var(--shadow); margin-bottom: 8px; }
  .row .emoji { font-size: 24px; width: 32px; text-align: center; }
  .row .body { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 16px; }
  .row .note { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .row .note input { width: 100%; border: 0; background: none; outline: 0; color: var(--muted); font-size: 13px; }
  .row .note input::placeholder { color: var(--faint); }
  .stepper { display: flex; align-items: center; background: var(--card-2); border-radius: 12px; overflow: hidden; }
  .stepper button { width: 40px; height: 40px; font-size: 20px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .stepper button:active { background: var(--line); }
  .stepper span { min-width: 26px; text-align: center; font-weight: 700; }
  .row .del { color: var(--faint); width: 36px; height: 40px; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .cta { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #fff; border-radius: 16px; padding: 18px; font-size: 17px; font-weight: 700; box-shadow: 0 8px 24px rgba(29,122,74,.3); }
  .cta:active { transform: scale(.98); }
  .cta.ghost { background: var(--card); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.6; }
  .empty .big { font-size: 44px; margin-bottom: 10px; }

  /* ── Mode magasin ── */
  #screen-shop { padding-bottom: calc(var(--tab-h) + 90px); }
  .progress { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(8px + env(safe-area-inset-top, 0px)) 0 12px; margin: calc(-12px - env(safe-area-inset-top, 0px)) 0 8px; }
  .progress .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .progress h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .progress .count { color: var(--muted); font-size: 15px; font-weight: 500; }
  .progress .count b { color: var(--text); font-size: 18px; }
  .bar { height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 4px; transition: width .35s ease; }
  .cat { margin: 14px 4px 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .item { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 16px; box-shadow: var(--shadow); margin-bottom: 8px; min-height: 64px; transition: transform .12s; }
  .item:active { transform: scale(.985); }
  .item .box { width: 30px; height: 30px; border-radius: 10px; border: 2.5px solid var(--blue); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; transition: background .15s, border-color .15s; }
  .item .emoji { font-size: 24px; }
  .item .label { flex: 1; font-size: 18px; font-weight: 600; }
  .item .label small { color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 6px; }
  .item.done { opacity: .5; }
  .item.done .box { background: var(--accent); border-color: var(--accent); }
  .item.done .label { text-decoration: line-through; text-decoration-thickness: 2px; font-weight: 500; }
  .item.leaving { animation: leave .3s ease forwards; }
  @keyframes leave { to { opacity: 0; transform: translateX(24px) scale(.96); height: 0; } }
  .done-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 4px 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .done-head button { color: var(--accent); font-size: 13px; letter-spacing: 0; text-transform: none; font-weight: 600; }
  .shop-bar { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tab-h) + 12px); display: flex; gap: 8px; z-index: 20; }
  .shop-bar .quick { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 16px; padding: 0 14px; box-shadow: var(--shadow); height: 52px; }
  .shop-bar .quick input { flex: 1; border: 0; background: none; outline: 0; font-size: 16px; min-width: 0; }
  .shop-bar .finish { background: var(--accent); color: #fff; border-radius: 16px; padding: 0 18px; font-weight: 700; height: 52px; box-shadow: 0 8px 24px rgba(29,122,74,.3); }
  .all-done { text-align: center; padding: 40px 20px 10px; }
  .all-done .big { font-size: 56px; margin-bottom: 8px; }
  .all-done h2 { font-size: 22px; margin-bottom: 6px; }
  .all-done p { color: var(--muted); }

  /* ── Onglets ── */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tab-h); padding-bottom: env(safe-area-inset-bottom, 0px); background: rgba(255,255,255,.9); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); border-top: 1px solid var(--line); display: flex; z-index: 30; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; position: relative; }
  .tab svg { width: 24px; height: 24px; }
  .tab.active { color: var(--blue); }
  .tab .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; }

  /* ── Feuille (bottom sheet) ── */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet-bg.show { opacity: 1; pointer-events: all; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 22px 22px 0 0; padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 41; transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
  .sheet.show { transform: none; }
  .sheet.dragging { transition: none; }
  .sheet .grip { width: 64px; height: 24px; background: none; margin: -8px auto 6px; position: relative; }
  .sheet .grip::after { content: ''; position: absolute; left: 12px; right: 12px; top: 10px; height: 4px; border-radius: 2px; background: var(--line); }
  body.locked { overflow: hidden; position: fixed; left: 0; right: 0; }
  .sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 16px; }
  .sheet h2 { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .field input { background: var(--card-2); border: 0; border-radius: 12px; padding: 14px; font-size: 16px; outline: 0; }
  .bank { max-height: 34vh; overflow-y: auto; background: var(--card-2); border-radius: 12px; padding: 8px; margin-top: 8px; }
  .bank-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 8px 4px 6px; }
  .bank-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .bank-grid button { aspect-ratio: 1; border-radius: 10px; font-size: 24px; display: flex; align-items: center; justify-content: center; border: 2px solid transparent; background: var(--card); }
  .bank-grid button.on { border-color: var(--accent); background: var(--accent-bg); }
  .emoji-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
  .emoji-row::-webkit-scrollbar { display: none; }
  .emoji-row button { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 12px; background: var(--card-2); font-size: 22px; border: 2px solid transparent; }
  .emoji-row button.on { border-color: var(--accent); background: var(--accent-bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 13px; border-radius: 12px; background: var(--card-2); font-size: 14px; font-weight: 500; border: 2px solid transparent; }
  .chip.on { border-color: var(--blue); background: var(--blue-bg); color: var(--blue-ink); font-weight: 600; }
  .sheet .actions { display: flex; gap: 8px; margin-top: 8px; }
  .sheet .actions .cta { padding: 15px; font-size: 16px; }
  .sheet .danger { color: var(--danger); font-weight: 600; text-align: center; width: 100%; padding: 14px; }
  .order-row { display: flex; align-items: center; gap: 10px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .order-row span { flex: 1; font-weight: 500; }
  .order-row button { width: 40px; height: 40px; border-radius: 12px; background: var(--card-2); font-size: 18px; }
  .hist { background: var(--card-2); border-radius: var(--r); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .hist .body { flex: 1; }
  .hist .d { font-weight: 600; }
  .hist .s { color: var(--muted); font-size: 13px; }
  .hist button { color: var(--accent); font-weight: 600; font-size: 14px; }
  .link { color: var(--blue); font-weight: 600; font-size: 14px; }
  .who { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; }
  .avatar.lola { background: #c2417a; } .avatar.simon { background: #2f5fbf; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
  .tag.lola { background: rgba(194,65,122,.14); color: #c2417a; } .tag.simon { background: rgba(47,95,191,.14); color: #2f5fbf; }
  .presence { display: flex; align-items: center; gap: 8px; background: var(--blue-bg); border-radius: 14px; box-shadow: none !important; padding: 10px 12px; box-shadow: var(--shadow); margin: 0 0 10px; font-size: 14px; }
  .presence .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); }
  .presence .dot.off { background: var(--faint); }
  .presence .t { color: var(--muted); font-size: 12px; margin-left: auto; }
  .sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sync .dot { width: 7px; height: 7px; border-radius: 4px; background: var(--faint); }
  .sync .dot.on { background: var(--accent); }
  .profile-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 14px; }
  .profile-pick button { background: var(--card-2); border-radius: 16px; padding: 22px 10px; font-size: 18px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 10px; border: 2px solid transparent; }
  .profile-pick button.on { border-color: var(--accent); background: var(--accent-bg); }
  .profile-pick .avatar { width: 48px; height: 48px; border-radius: 24px; font-size: 20px; }
  .seg { display: flex; background: var(--card-2); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { flex: 1; padding: 8px 10px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--blue-ink); box-shadow: var(--shadow); }
  .seg button.on.lola { color: #c2417a; } .seg button.on.simon { color: #2f5fbf; }
  .for-bar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
  .for-bar .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
  .tile.on.lola { background: rgba(194,65,122,.12); border-color: #c2417a; } .tile.on.lola .name { color: #c2417a; } .tile.on.lola .qty { background: #c2417a; }
  .tile.on.simon { background: rgba(47,95,191,.12); border-color: #2f5fbf; } .tile.on.simon .name { color: #2f5fbf; } .tile.on.simon .qty { background: #2f5fbf; }
  .asg { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; background: var(--card-2); color: var(--muted); flex-shrink: 0; }
  .asg.lola { background: rgba(194,65,122,.14); color: #c2417a; } .asg.simon { background: rgba(47,95,191,.14); color: #2f5fbf; }
  .cat.other { color: var(--faint); margin-top: 26px; }
  .item.other { opacity: .55; }
  .item.other.done { opacity: .35; }
  .split { display: flex; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .split b { font-weight: 700; } .split .lola b { color: #c2417a; } .split .simon b { color: #2f5fbf; }
  /* ── Plats ── */
  .goal { background: linear-gradient(135deg, var(--blue-bg), var(--accent-bg)); border-radius: var(--r); padding: 14px 16px; margin-bottom: 14px; }
  .goal .pips i { background: rgba(255,255,255,.8); }
  .goal .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .goal .top b { font-size: 15px; }
  .goal .top span { color: var(--muted); font-size: 13px; }
  .goal .pips { display: flex; gap: 6px; }
  .goal .pips i { flex: 1; height: 8px; border-radius: 4px; background: var(--card-2); }
  .goal .pips i.on { background: #d9534f; }
  .goal .pips i.over { background: #8e1b14; }
  .goal.over .top b { color: var(--danger); }
  .goal .stats { display: flex; gap: 14px; justify-content: space-around; font-size: 13px; color: var(--muted); }
  .goal .stats b { color: var(--text); font-weight: 700; }
  .cal { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 10px 10px; margin-bottom: 14px; }
  .cal .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .day { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding-bottom: 6px; }
  .cal .day small { display: block; font-weight: 500; color: var(--faint); text-transform: none; letter-spacing: 0; }
  .cal .day.today { color: var(--accent); }
  .cal .slot { aspect-ratio: 1; border-radius: 10px; background: var(--card-2); color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--faint); border: 2px solid transparent; transition: transform .12s; }
  .cal .slot:active { transform: scale(.9); }
  .cal .slot.on { background: var(--accent-bg); border-color: var(--accent); }
  .cal .slot.viande.on { background: rgba(217,83,79,.12); border-color: #d9534f; }
  .cal .slot.poisson.on { background: rgba(47,95,191,.12); border-color: #2f5fbf; }
  .cal .rowlbl { grid-column: 1 / -1; font-size: 10px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin: 6px 2px 2px; }
  .cal .slot .nm { display: none; }
  .cal .hint { text-align: center; margin-top: 8px; }
  .pick { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .pick:last-child { border-bottom: 0; }
  .pick .emoji { font-size: 24px; width: 32px; text-align: center; }
  .pick .name { flex: 1; font-weight: 600; font-size: 15px; }
  .pick.on { color: var(--accent-ink); }
  .pick-list { max-height: 50vh; overflow-y: auto; }
  .filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding: 2px; }
  .filters::-webkit-scrollbar { display: none; }
  .filters .chip { flex: 0 0 auto; }
  .meals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

<script>
/* ═════════════════════════════════════════════════════════════

const CATEGORIES = [

const SEED = [
  ['fruits', '🍅 Tomates', '🥒 Concombre', '🥕 Carottes', '🥬 Salade', '🧅 Oignons', '🧄 Ail', '🍋 Citrons', '🍌 Bananes', '🍎 Pommes', '🥑 Avocats', '🍓 Fraises', '🥔 Pommes de terre', '🍄 Champignons', '🫑 Poivrons', '🥦 Brocoli'],

  ['feculents', '🍝 Pâtes', '🍚 Riz', '🍠 Purée', '🍛 Semoule', '🫘 Lentilles', '🍞 Pain de mie'],
  ['petitdej', '🥐 Croissants', '🌽 Céréales', '☕ Café', '🍵 Thé', '🍇 Confiture', '🍊 Jus d\'orange', '🥞 Brioche'],
  ['boissons', '💧 Eau', '🥤 Coca', '🍺 Bière', '🍷 Vin', '🧃 Sirop', '🫧 Eau pétillante'],

  ['maison', '🕯️ Bougies', '💡 Ampoules', '🔋 Piles', '🫖 Filtres à café'],
];

const repo = {
  KEY: 'courses_v2',
  load() {
    try { const s = JSON.parse(localStorage.getItem(this.KEY)); if (s && s.products) return s } catch {}
    return null
  },
  save(state) { try { localStorage.setItem(this.KEY, JSON.stringify(state)) } catch {} },
  seed() {
    const products = []
    SEED.forEach(([cat, ...items]) => items.forEach(s => { const [emoji, ...rest] = s.split(' '); const name = rest.join(' '); products.push({ id: 'p-' + norm(name), name, emoji, cat, uses: 0 }) }))
    return { products, categoryOrder: CATEGORIES.map(c => c.id), list: [], shopping: false, startedAt: null, history: [], presence: {}, rev: 0, epoch: 0, plan: { items: {}, slots: {}, updatedAt: 0 }, customMeals: [] }
  },
}
const PROFILES = { lola: { name: 'Lola', initial: 'L' }, simon: { name: 'Simon', initial: 'S' } }
// Préférences locales à CE téléphone (jamais synchronisées) : profil + code du foyer
const local = { get: () => { try { return JSON.parse(localStorage.getItem('courses_local_v2')) || {} } catch { return {} } }, set: v => localStorage.setItem('courses_local_v2', JSON.stringify(v)) }
let ME = local.get().profile || null
let HOUSEHOLD = local.get().household || 'lola-simon-v2'
let FOR = null // destinataire des prochains ajouts : 'lola' | 'simon' | null (les deux)
const uid = () => Math.random().toString(36).slice(2, 10)
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '')
let S = repo.load() || repo.seed()
if (!S.presence) S.presence = {}
if (!S.rev) S.rev = 0
if (!S.epoch) S.epoch = 0
if (!S.plan) S.plan = { items: {}, updatedAt: 0 }
if (!S.plan.slots) S.plan.slots = {}
if ((S.mealsRev || 0) < 2) { S.plan = { items: {}, slots: {}, updatedAt: 0 }; S.mealsRev = 2; repo.save(S) }
if (!S.customMeals) S.customMeals = []
S.list.forEach(l => { if (!l.updatedAt) l.updatedAt = 0 })
// Dédoublonnage : un seul produit par nom (les anciens identifiants aléatoires sont remplacés par 'p-<nom>')
function dedupe(state) {
  const keep = new Map(), remap = {}
  state.products.forEach(p => {
    const key = norm(p.name)
    const id = 'p-' + key
    const ex = keep.get(key)
    if (ex) { ex.uses = Math.max(ex.uses || 0, p.uses || 0); remap[p.id] = ex.id }
    else { if (p.id !== id) remap[p.id] = id; p.id = id; keep.set(key, p) }
  })
  state.products = [...keep.values()]
  const fix = pid => remap[pid] || pid
  const byPid = new Map()
  ;(state.list || []).map(l => ({ ...l, pid: fix(l.pid) })).forEach(l => { const ex = byPid.get(l.pid); if (!ex || (l.updatedAt || 0) > (ex.updatedAt || 0)) byPid.set(l.pid, l) })
  state.list = [...byPid.values()]
  ;(state.history || []).forEach(h => { h.items = h.items.map(i => ({ ...i, pid: fix(i.pid) })) })
  return state
}
dedupe(S)
// Migration d'icônes (une fois) : les produits de départ prennent leurs nouvelles icônes distinctes
if ((S.iconRev || 0) < 2) {
  const seedIcons = {}; SEED.forEach(([, ...items]) => items.forEach(x => { const [emoji, ...rest] = x.split(' '); seedIcons['p-' + norm(rest.join(' '))] = emoji }))
  S.products.forEach(pr => { if (seedIcons[pr.id]) pr.emoji = seedIcons[pr.id] })
  S.iconRev = 2; repo.save(S)
}
let saveT = null
const persist = () => { S.rev = (S.rev || 0) + 1; clearTimeout(saveT); saveT = setTimeout(() => { repo.save(S); sync.push() }, 120) }
const now = () => Date.now()
const touch = l => { l.updatedAt = now() }

/* ═════════ Helpers ═════════ */
const $ = id => document.getElementById(id)
const cat = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length - 1]
const inList = pid => S.list.find(l => l.pid === pid)
const product = pid => S.products.find(p => p.id === pid)
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const buzz = (ms = 12) => { try { navigator.vibrate && navigator.vibrate(ms) } catch {} }
let toastT = null
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600) }
// Icône = emoji, ou pastille « #couleur|TXT » (2-3 lettres sur fond coloré) quand aucun emoji ne convient
const icon = (e, cls = 'emoji') => {
  if (typeof e === 'string' && e.startsWith('#') && e.includes('|')) { const [bg, txt] = e.split('|'); const dark = parseInt(bg.slice(1, 3), 16) * .299 + parseInt(bg.slice(3, 5), 16) * .587 + parseInt(bg.slice(5, 7), 16) * .114 > 160; return `<span class="${cls} mono" style="background:${esc(bg)};color:${dark ? '#141412' : '#fff'}">${esc(txt.slice(0, 3))}</span>` }
  return `<span class="${cls}">${esc(e)}</span>`
}
const plural = (n, s) => `${n} ${s}${n > 1 ? 's' : ''}`
const forOf = l => l.assignee || null
const forLabel = a => a === 'lola' ? 'L' : a === 'simon' ? 'S' : '👥'
const forName = a => a ? PROFILES[a].name : 'les deux'
function setFor(a) { FOR = a; renderForSeg() }
function renderForSeg() { const el = $('for-seg'); if (!el) return; el.innerHTML = [[null, '👥 Les deux'], ['lola', 'Lola'], ['simon', 'Simon']].map(([a, l]) => `<button class="${FOR === a ? 'on ' + (a || '') : ''}" onclick="setFor(${a ? `'${a}'` : 'null'})">${l}</button>`).join('') }
const orderedCats = () => [...S.categoryOrder.map(cat), ...CATEGORIES.filter(c => !S.categoryOrder.includes(c.id))]

/* ═════════ Onglets ═════════ */
let tab = 'meals'
function showTab(t) {
  tab = t
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + t))

}

/* ═════════ PRÉPARER ═════════ */
function addToList(pid, qty = 1) {
  const l = inList(pid)
  if (l) { l.qty += qty; if (l.qty <= 0) removeFromList(pid) }

function renderPresence() {

/* ── Calendrier de la semaine : 7 jours × (midi, soir). Un plat placé dans N cases = N repas × 2 personnes. ── */

const slotsOf = id => Object.entries(S.plan.slots).filter(([, v]) => v === id).map(([k]) => k)

// Trouve ou crée le produit correspondant à un ingrédient (identifiant déterministe = même produit sur les deux téléphones)
function ensureProduct(name, cat, emoji) {

// Plats perso : « 400 g poulet » par ligne → [emoji, nom, qté, unité, rayon]
const UNIT_RE = /^\s*(\d+(?:[.,]\d+)?)?\s*(kg|g|ml|cl|l|boîtes?|boites?|pots?|sachets?|pavés?|paves?|cubes?|tranches?|gousses?|pièces?|pieces?|pcs?)?\.?\s*(?:de |d')?(.+?)\s*$/i
const CAT_HINTS = [['viandes', /poulet|b[oœ]uf|dinde|porc|veau|agneau|steak|hach|lardon|saucisse|jambon|canard|lapin/], ['poissons', /saumon|thon|cabillaud|colin|crevette|poisson|truite|sardine|maquereau|dorade|lieu/], ['frais', /[oœ]uf|lait|cr[eè]me|yaourt|fromage blanc|beurre|tofu|skyr/], ['fromages', /feta|mozza|parmesan|emmental|comt[eé]|ch[eè]vre|ricotta|gruy[eè]re|cheddar/], ['feculents', /riz|p[aâ]tes|quinoa|lentille|semoule|boulgour|nouille|pomme de terre|patate|pain/], ['surgeles', /surgel|edamame|petits pois|haricots verts/], ['epicerie', /huile|sauce|[eé]pice|curry|cumin|paprika|bo[iî]te|conserve|pois chiche|haricot|ma[iï]s|coco|tomates concass|moutarde|bouillon|olive|graine|tortilla|farine|sucre|miel|vinaigre/], ['fruits', /tomate|courgette|poivron|oignon|ail|carotte|brocoli|salade|[eé]pinard|avocat|citron|concombre|champignon|aubergine|chou|poireau|gingembre|herbe|persil|aneth|basilic|banane|pomme|fruit|l[eé]gume/]]
const guessCat = n => { const x = norm(n).replace(/-/g, ' '); const p = S.products.find(q => norm(q.name) === norm(n)); if (p) return p.cat; return (CAT_HINTS.find(([, re]) => re.test(x)) || ['autres'])[0] }
const guessEmoji = n => { const p = S.products.find(q => norm(q.name) === norm(n)); if (p) return p.emoji; const x = norm(n).replace(/-/g, ' '); const hit = EMOJI_BANK.flatMap(([, l]) => l).find(([, k]) => k.split(' ').some(w => w.length > 2 && x.includes(norm(w)))); return hit ? hit[0] : '🛒' }
function parseIngredients(text) {
  return text.split('\n').map(line => line.trim()).filter(Boolean).map(line => {
    const m = line.match(UNIT_RE); if (!m) return null
    let [, q, u, name] = m; q = q ? parseFloat(q.replace(',', '.')) : 1; u = (u || '').toLowerCase()
    u = u.replace(/s$/, '').replace('boite', 'boîte').replace('pave', 'pavé'); if (['piece', 'pièce', 'pc'].includes(u)) u = ''
    name = name.charAt(0).toUpperCase() + name.slice(1)
    return [guessEmoji(name), name, q, u, guessCat(name)]
  }).filter(Boolean)
}
function saveMeal() {
  const name = $('f-name').value.trim(); if (!name) { $('f-name').focus(); return }
  const ing = parseIngredients($('f-ing').value); if (!ing.length) { $('f-ing').focus(); toast('Ajoute au moins un ingrédient'); return }
  const kcal = parseInt($('f-kcal').value) || 0, time = parseInt($('f-time').value) || 0
  const id = sheetState.mealId || ('m-' + norm(name) + '-' + uid().slice(0, 4))
  const m = { id, name, emoji: sheetState.emoji, type: sheetState.type || 'vege', kcal, time, ing, custom: true, updatedAt: now() }
  S.customMeals = (S.customMeals || []).filter(x => x.id !== id); S.customMeals.push(m)
  persist(); closeSheet(); mealFilter = 'mine'; render(); toast(`${m.emoji} ${m.name} créé`)
}
function deleteMeal(id) { if (!confirm('Supprimer ce plat ?')) return; const m = S.customMeals.find(x => x.id === id); if (m) { m.deleted = true; m.updatedAt = now() } delete S.plan.items[id]; touchPlan(); persist(); closeSheet(); render() }
function pickType(t) { sheetState.type = t; document.querySelectorAll('#f-types .chip').forEach(b => b.classList.toggle('on', b.dataset.t === t)) }
function setSheetPortions(id, d) { sheetState.portions = Math.max(PEOPLE, sheetState.portions + d); openSheet('meal', id) }

/* ═════════ SYNCHRO — Supabase (table courses_state) ═════════
   Une ligne par foyer : { id, state jsonb, updated_at }. Chaque téléphone pousse son état après chaque
   modification et reçoit ceux de l'autre en temps réel ; la fusion se fait ARTICLE PAR ARTICLE (le plus
   récent gagne), donc deux personnes peuvent cocher en même temps sans s'écraser. Hors connexion, tout
   continue de marcher en local et se rattrape au retour du réseau.                                     */
const SB_URL = 'https://vxzjfwjxgewdqvfdsxjm.supabase.co'
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4empmd2p4Z2V3ZHF2ZmRzeGptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTM1MDcsImV4cCI6MjEwNDM4OTUwN30.IuIcPXXrVozPDDreB-hkY1didQoboV0pEuH8-8GaWLo'
const sync = {
  db: null, channel: null, online: false, lastError: null, pushT: null, applying: false,
  status() { return this.lastError ? '⚠️ ' + this.lastError : this.online ? '✓ Connecté · les deux téléphones se voient en direct' : 'Connexion…' },
  ui() { document.querySelectorAll('#sync .dot, #sync2 .dot').forEach(d => d.classList.toggle('on', this.online)); const i = $('sync-info'); if (i) i.textContent = this.status() },
  async connect() {
    try {
      if (!window.supabase) throw new Error('librairie Supabase non chargée')
      if (!this.db) this.db = window.supabase.createClient(SB_URL, SB_KEY)
      if (this.channel) { this.db.removeChannel(this.channel); this.channel = null }
      const { data, error } = await this.db.from('courses_state').select('state').eq('id', HOUSEHOLD).maybeSingle()
      if (error) throw error
      if (data && data.state) this.apply(data.state); else await this.pushNow()
      this.channel = this.db.channel('coursesv2-' + HOUSEHOLD)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'courses_state', filter: 'id=eq.' + HOUSEHOLD }, payload => { if (payload.new && payload.new.state) this.apply(payload.new.state) })
        .subscribe(st => { this.online = st === 'SUBSCRIBED'; this.ui() })
      this.lastError = null
    } catch (e) { this.online = false; this.lastError = /relation|does not exist|schema cache/i.test(e.message) ? 'Table courses_state absente : exécute le SQL fourni dans Supabase' : e.message; this.ui() }
    // Présence rafraîchie toutes les 30 s pendant les courses
    clearInterval(this._tick); this._tick = setInterval(() => { if (tab === 'shop' && S.shopping) renderPresence() }, 30000)
  },
  push() { clearTimeout(this.pushT); this.pushT = setTimeout(() => this.pushNow(), 400) },
  async pushNow() {
    if (!this.db || this.applying) return
    try { const { error } = await this.db.from('courses_state').upsert({ id: HOUSEHOLD, state: S, updated_at: new Date().toISOString() }); if (error) throw error; this.lastError = null } catch (e) { this.lastError = e.message } finally { this.ui() }
  },
  // Fusion : produits (union, le plus récent par id), liste (par article, updatedAt le plus récent), suppressions, présence, historique
  apply(remote) {
    if (!remote || typeof remote !== 'object') return
    this.applying = true
    try {
      remote = dedupe(JSON.parse(JSON.stringify(remote)))
      // Top de fin : la liste la plus récemment terminée/vidée l'emporte, les articles antérieurs disparaissent
      const epoch = Math.max(S.epoch || 0, remote.epoch || 0)
      if (epoch > (S.epoch || 0)) { S.list = S.list.filter(l => (l.createdAt || 0) > epoch); S.shopping = false }
      S.epoch = epoch
      const byId = new Map(S.products.map(p => [p.id, p]))
      ;(remote.products || []).forEach(p => { const mine = byId.get(p.id); if (!mine) S.products.push(p); else if ((p.uses || 0) > (mine.uses || 0)) mine.uses = p.uses })
      const removed = { ...(remote.removed || {}), ...(S.removed || {}) }
      Object.entries(remote.removed || {}).forEach(([pid, t]) => { if (t > (S.removed?.[pid] || 0)) removed[pid] = t })
      const list = new Map(S.list.map(l => [l.pid, l]))
      ;(remote.list || []).filter(r => (r.createdAt || 0) > epoch || !epoch).forEach(r => { const m = list.get(r.pid); if (!m || (r.updatedAt || 0) > (m.updatedAt || 0)) list.set(r.pid, r) })
      S.list = [...list.values()].filter(l => !(removed[l.pid] > (l.updatedAt || 0)))
      S.removed = removed
      if ((remote.rev || 0) > (S.rev || 0)) { S.shopping = !!remote.shopping && S.list.length > 0; S.startedAt = remote.startedAt || S.startedAt; if (remote.categoryOrder) S.categoryOrder = remote.categoryOrder }
      dedupe(S)
      S.presence = { ...(S.presence || {}), ...(remote.presence || {}) }
      Object.entries(remote.presence || {}).forEach(([k, v]) => { if (!S.presence[k] || v.at > S.presence[k].at) S.presence[k] = v })
      const hist = new Map((S.history || []).map(h => [h.id, h])); (remote.history || []).forEach(h => { if (!hist.has(h.id)) hist.set(h.id, h) })
      S.history = [...hist.values()].sort((a, b) => b.at - a.at).slice(0, 20)
      if ((remote.plan?.updatedAt || 0) > (S.plan?.updatedAt || 0)) { S.plan = remote.plan; if (!S.plan.slots) S.plan.slots = {} }
      const cm = new Map((S.customMeals || []).map(m => [m.id, m])); (remote.customMeals || []).forEach(m => { const mine = cm.get(m.id); if (!mine || (m.updatedAt || 0) > (mine.updatedAt || 0)) cm.set(m.id, m) }); S.customMeals = [...cm.values()]
      S.rev = Math.max(S.rev || 0, remote.rev || 0)
      repo.save(S); render()
    } finally { this.applying = false }
  },
}

/* ═════════ Rendu global ═════════ */
function render() { renderMeals(); renderPrep(); renderList(); renderShop(); ['me-avatar', 'me-avatar2'].forEach(id => { const a = $(id); if (a) { a.textContent = ME ? PROFILES[ME].initial : '?'; a.className = 'avatar ' + (ME || '') } }) }
render()
if (!ME) { openSheet('settings'); setTimeout(() => toast('Choisis ton profil 👆'), 400) }
sync.connect()
// Glisser la feuille vers le bas pour la fermer (depuis le haut de son contenu)
;(() => {
  const sh = $('sheet'); let y0 = null, dy = 0, pull = false
  sh.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; pull = sh.scrollTop <= 0 }, { passive: true })
  sh.addEventListener('touchmove', e => {
    if (y0 === null || !pull) return
    dy = e.touches[0].clientY - y0
    if (dy <= 0) { sh.classList.remove('dragging'); sh.style.transform = ''; return }
    e.preventDefault(); sh.classList.add('dragging'); sh.style.transform = `translateY(${dy}px)`
  }, { passive: false })
  const end = () => { if (y0 === null) return; sh.classList.remove('dragging'); sh.style.transform = ''; if (pull && dy > 90) closeSheet(); y0 = null; dy = 0 }
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end)
})()
// Ré-affiche la barre d'ajout rapide quand le clavier se ferme (iOS)
window.addEventListener('resize', () => { if (tab === 'shop') $('shop-bar').classList.toggle('hidden', !S.shopping) })
