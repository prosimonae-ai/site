<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Liste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://use.typekit.net/kid8vvq.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #f7f6f3;
    --surface: #ffffff;
    --border:  #e5e3de;
    --text:    #111110;
    --muted:   #888580;
    --accent:  #111110;
    --tag-bg:  #eceae5;
    --pick:    #2d5a3d;
    --pick-bg: #e8f0eb;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ── LOCK SCREEN ── */
  #lock {
    position: fixed; inset: 0; z-index: 999;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
    transition: opacity 500ms ease, transform 500ms ease;
  }
  #lock.out { opacity: 0; transform: translateY(-8px); pointer-events: none; }

  .lock-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .lock-field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  #name-input, #pwd-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    text-align: center;
    width: 180px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 200ms;
  }
  #name-input { font-size: 15px; font-weight: 400; letter-spacing: 0.05em; }
  #name-input:focus, #pwd-input:focus { border-color: var(--text); }
  #name-input::placeholder { color: #ccc; }
  #pwd-input {
    font-size: 22px; font-weight: 300; letter-spacing: 0.5em;
  }
  #pwd-input::placeholder { letter-spacing: 0.2em; color: #ccc; font-size: 18px; }

  .lock-error {
    font-size: 11px;
    color: #c0392b;
    opacity: 0;
    transition: opacity 250ms;
    height: 14px;
  }
  .lock-error.show { opacity: 1; }

  #lock-btn {
    background: var(--text);
    border: none;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 150ms;
  }
  #lock-btn:hover { opacity: 0.75; }
  #lock-switch {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-top: 4px;
    text-decoration: underline;
    font-family: 'Inter', sans-serif;
  }
  #lock-switch:hover { color: var(--text); }

  /* ── VAULT ── */
  #the-liste { display: none; }
  #the-liste.visible { display: block; }

  /* Top bar supprimée — titre + compteur intégrés au filtre */
  .v-top {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 40px 32px;
    text-align: center;
    position: relative;
  }
  /* Profile button */
  #profile-btn {
    position: absolute;
    top: 24px; right: 24px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 600;
    color: var(--text);
    transition: border-color 200ms;
    flex-shrink: 0;
  }
  #profile-btn:hover { border-color: var(--text); }
  #profile-btn img { width: 100%; height: 100%; object-fit: cover; }

  /* View toggle */
  .v-toggle {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 16px;
  }
  .v-toggle-btn {
    background: none; border: none;
    font-family: 'Inter', sans-serif;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 7px 18px; cursor: pointer; color: var(--muted);
    transition: all 200ms;
  }
  .v-toggle-btn.active { background: var(--text); color: var(--bg); }

  /* Owner badge on feed cards */
  .card-owner {
    position: absolute; top: 10px; left: 10px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(6px);
    border-radius: 20px; padding: 4px 8px 4px 4px;
    font-size: 11px; font-weight: 600; color: #222;
  }
  .card-owner-av {
    width: 18px; height: 18px; border-radius: 50%;
    background: #eee; display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; overflow: hidden; flex-shrink: 0;
  }
  .card-owner-av img { width: 100%; height: 100%; object-fit: cover; }

  /* Empty feed */
  .feed-empty {
    grid-column: 1/-1; text-align: center;
    padding: 60px 20px; color: var(--muted); font-size: 14px;
  }

  /* Friend profile view */
  #friend-profile { display: none; }
  #friend-profile.visible { display: block; }
  #fp-header {
    max-width: 1200px; margin: 0 auto;
    padding: 32px 40px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    position: relative; text-align: center;
  }
  #fp-back {
    position: absolute; top: 32px; left: 40px;
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-family: 'Inter', sans-serif;
    font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; display: flex; align-items: center; gap: 6px;
    padding: 0; transition: color 200ms;
  }
  #fp-back:hover { color: var(--text); }
  #fp-big-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--surface); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: var(--text);
    overflow: hidden;
  }
  #fp-big-avatar img { width: 100%; height: 100%; object-fit: cover; }
  #fp-title {
    font-family: 'stevie-sans', sans-serif;
    font-size: 42px; font-weight: 600; font-style: italic;
    letter-spacing: -0.03em; color: var(--text); opacity: 0.12;
    margin: 0;
  }
  #fp-cat-nav {
    padding: 0 40px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    max-width: 1200px; margin: 0 auto;
  }
  @media (max-width: 600px) {
    #fp-header { padding: 28px 16px 16px; }
    #fp-back { left: 16px; top: 28px; }
    #fp-cat-nav { padding: 0 16px; }
  }

  /* Profile panel */
  #profile-panel {
    position: fixed; inset: 0; z-index: 900;
    display: flex; justify-content: flex-end;
    pointer-events: none;
  }
  #profile-panel.open { pointer-events: all; }
  #profile-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0);
    transition: background 300ms;
  }
  #profile-panel.open #profile-overlay { background: rgba(0,0,0,0.18); }
  #profile-drawer {
    position: relative;
    width: 320px; max-width: 90vw;
    height: 100%;
    background: var(--bg);
    border-left: 1px solid var(--border);
    padding: 32px 24px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 350ms cubic-bezier(0.16,1,0.3,1);
    display: flex; flex-direction: column; gap: 28px;
  }
  #profile-panel.open #profile-drawer { transform: translateX(0); }

  .prof-avatar-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  #prof-avatar {
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--surface); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 600; color: var(--text);
    overflow: hidden; cursor: pointer; position: relative;
  }
  #prof-avatar img { width: 100%; height: 100%; object-fit: cover; }
  #prof-avatar:hover::after {
    content: '✎';
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px;
    border-radius: 50%;
  }
  #prof-name-display {
    font-size: 17px; font-weight: 600; color: var(--text);
  }
  #avatar-input { display: none; }

  .prof-section { display: flex; flex-direction: column; gap: 10px; }
  .prof-section-title {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .prof-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 14px;
    padding: 10px 12px; outline: none; width: 100%;
    transition: border-color 200ms; box-sizing: border-box;
  }
  .prof-input:focus { border-color: var(--text); }
  .prof-btn {
    background: var(--text); color: var(--bg);
    border: none; border-radius: 6px;
    font-family: 'Inter', sans-serif; font-size: 11px;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 10px 16px; cursor: pointer; width: 100%;
    transition: opacity 150ms;
  }
  .prof-btn:hover { opacity: 0.75; }
  .prof-btn.secondary {
    background: none; border: 1px solid var(--border);
    color: var(--text);
  }
  .prof-msg { font-size: 12px; color: var(--muted); min-height: 16px; }
  .prof-msg.ok { color: #27ae60; }
  .prof-msg.err { color: #c0392b; }

  /* Friends */
  .friend-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .friend-row:last-child { border-bottom: none; }
  .friend-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--text);
    overflow: hidden; flex-shrink: 0;
  }
  .friend-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .friend-name { font-size: 14px; color: var(--text); flex: 1; }
  .friend-action {
    background: none; border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px;
    font-family: 'Inter', sans-serif; font-size: 11px;
    font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    cursor: pointer; color: var(--text); transition: all 150ms; flex-shrink: 0;
  }
  .friend-action:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
  .friend-action.remove { color: #c0392b; border-color: #c0392b; }
  .friend-action.remove:hover { background: #c0392b; color: #fff; border-color: #c0392b; }
  #friends-search-results { display: flex; flex-direction: column; }
  #friends-search-results .friend-row { border-bottom: 1px solid var(--border); }
  .friend-action.pending { color: var(--muted); border-color: var(--border); cursor: default; }
  .friend-action.pending:hover { background: none; color: var(--muted); border-color: var(--border); }
  .friend-action.accept { color: #27ae60; border-color: #27ae60; }
  .friend-action.accept:hover { background: #27ae60; color: #fff; border-color: #27ae60; }
  .friend-action.decline { color: #c0392b; border-color: #c0392b; }
  .friend-action.decline:hover { background: #c0392b; color: #fff; }
  .v-logo {
    font-family: 'stevie-sans', sans-serif;
    font-size: 52px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: -0.03em;
    text-transform: none;
    color: var(--text);
    opacity: 0.12;
  }
  #item-count {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* Filters */
  .v-filters {
    padding: 0 40px 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 1200px;
    margin: 0 auto;
  }
  .v-filters::-webkit-scrollbar { display: none; }

  /* Bouton add — flottant, cercle fin, zen */
  #add-btn {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    background: var(--text);
    border: 1px solid var(--text);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 12px 28px;
    border-radius: 100px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    transition: border-color 200ms, color 200ms, box-shadow 200ms;
  }
  #add-btn:hover { opacity: 0.85; box-shadow: 0 4px 28px rgba(0,0,0,0.2); }
  #add-btn svg { width: 10px; height: 10px; opacity: 0.7; }

  .cat-btn {
    background: none;
    border: none;
    color: rgba(0,0,0,0.3);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    border-radius: 100px;
    cursor: pointer;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    transition: color 200ms, background 200ms;
  }
  .cat-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .cat-btn:hover { color: var(--text); }
  .cat-btn.active { background: var(--text); color: #fff; }

  /* Bento */
  .v-bento {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 40px 120px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .wish-card {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid rgba(0,0,0,0.06);
    cursor: default;
    aspect-ratio: 1;
    transition: box-shadow 400ms ease, transform 400ms ease;
    animation: cardIn 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .wish-card:hover { box-shadow: 0 12px 48px rgba(0,0,0,0.07); transform: translateY(-2px); }

  .card-bg {
    position: absolute;
    inset: 32px 32px 72px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    mix-blend-mode: multiply;
    transition: transform 400ms ease;
  }
  .wish-card:hover .card-bg { transform: scale(1.05); }

  .card-body {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
  }

  .card-tags { display: none; }
  .cat-tag, .pick-tag { display: none; }

  .card-actions {
    display: flex; gap: 4px;
    opacity: 0;
    transition: opacity 150ms;
  }
  .wish-card:hover .card-actions { opacity: 1; }

  .card-del, .card-edit {
    background: rgba(255,255,255,0.85);
    border: none;
    cursor: pointer;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: color 150ms, background 150ms;
    backdrop-filter: blur(4px);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card-del  { color: var(--muted); }
  .card-edit { color: var(--muted); }
  .card-del:hover  { color: #c0392b; background: #fdf0ee; }
  .card-edit:hover { color: var(--text); background: var(--tag-bg); }
  .card-del svg, .card-edit svg { width: 10px; height: 10px; }

  .card-bottom {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .card-brand {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.3);
  }
  .card-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 5px;
  }
  .card-price {
    font-size: 12px;
    font-weight: 400;
    color: rgba(0,0,0,0.45);
  }
  .card-price.unknown { display: none; }
  .card-link {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.25);
    text-decoration: none;
    display: flex; align-items: center; gap: 3px;
    transition: color 200ms;
  }
  .card-link:hover { color: var(--text); }
  .card-link svg { width: 8px; height: 8px; }

  .v-empty {
    grid-column: 1/-1;
    padding: 64px 0;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── MODAL ── */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 250ms;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    transform: translateY(10px);
    transition: transform 250ms ease;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }

  .modal-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--text);
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field label .auto-badge {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: none;
    color: var(--pick);
    background: var(--pick-bg);
    padding: 1px 6px;
    border-radius: 100px;
  }
  .field input, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 150ms;
  }
  .field input:focus { border-color: var(--text); }
  .field input::placeholder { color: #bbb; }

  /* URL field special */
  .url-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .url-wrap input { padding-right: 36px; }
  .url-spinner {
    position: absolute; right: 10px;
    width: 14px; height: 14px;
    border: 1.5px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .url-wrap.loading .url-spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .url-hint {
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
    transition: color 200ms;
  }
  .url-hint.ok { color: var(--pick); }
  .url-hint.err { color: #c0392b; }

  /* Fetch preview card */
  .fetch-preview {
    display: none;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .fetch-preview.show { display: flex; }
  .fp-img {
    width: 64px; height: 64px;
    flex-shrink: 0;
    border-radius: 6px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    background-color: #fff;
    border: 1px solid var(--border);
  }
  .fp-info { flex: 1; min-width: 0; }
  .fp-brand { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .fp-name  { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .fp-price { font-size: 12px; color: var(--muted); }


  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn-cancel {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: border-color 150ms;

  const nameVal = nameInput.value.trim().toLowerCase();

  if (lockMode === 'register') {
    const { data: existing } = await db.from('users').select('id').eq('id', nameVal).single();

      lockErr.textContent = 'Ce prénom est déjà pris';

      setTimeout(() => lockErr.classList.remove('show'), 2500);
      return;

    const displayName = nameInput.value.trim().charAt(0).toUpperCase() + nameInput.value.trim().slice(1);
    const { error } = await db.from('users').insert({ id: nameVal, password: passVal, name: displayName });
    if (error) { console.error(error); return; }
  }

  const { data, error } = await db.from('users').select('*').eq('id', nameVal).eq('password', passVal).single();

  if (wishlistCache[uid]) return wishlistCache[uid];
  const { data } = await db.from('wishlist').select('items').eq('id', uid).single();
  const result = Array.isArray(data?.items) ? data.items : [];
  wishlistCache[uid] = result;
  return result;
}

async function prefetchFriendWishlists(friendIds) {
  const uncached = friendIds.filter(id => !wishlistCache[id]);
  if (uncached.length === 0) return;
  const { data } = await db.from('wishlist').select('id, items').in('id', uncached);
  (data || []).forEach(row => {
    wishlistCache[row.id] = Array.isArray(row.items) ? row.items : [];
  });
}

async function renderFeed(filterUserId = feedFriendFilter) {
  feedFriendFilter = filterUserId;
  const list = document.getElementById('wish-list');
  list.innerHTML = '<div class="feed-empty">Chargement…</div>';

  const accepted = myRequests.filter(r => r.status === 'accepted');

  if (friendIds.length === 0) {
    list.innerHTML = '<div class="feed-empty">Ajoute des amis pour voir leur liste ici.</div>';
    return;

  const targetIds = filterUserId ? [filterUserId] : friendIds;

  const [wishRes, userRes] = await Promise.all([
    db.from('wishlist').select('id, items').in('id', targetIds),
    db.from('users').select('id, name, avatar').in('id', targetIds),
  ]);

  const userMap = {};
  (userRes.data || []).forEach(u => { userMap[u.id] = u; });

  const allItems = [];

    const owner = userMap[row.id];

  list.innerHTML = '';
  if (allItems.length === 0) {

  }

  allItems.sort(() => Math.random() - 0.5);

  allItems.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'wish-card';
    const ownerAv = item._owner.avatar
      ? `<img src="${item._owner.avatar}" alt="">`
      : initials(item._owner.name);
    card.innerHTML = `
      ${item.img ? `<div class="card-bg" style="background-image:url('${item.img}')"></div>` : ''}
      <div class="card-owner">
        <div class="card-owner-av">${ownerAv}</div>
        ${item._owner.name}
      </div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-tags">
            ${item.cat  ? `<span class="cat-tag">${item.cat}</span>` : ''}
            ${item.pick ? `<span class="pick-tag">★</span>` : ''}
          </div>
        </div>
        <div class="card-bottom">
          ${item.brand ? `<p class="card-brand">${item.brand}</p>` : ''}
          <p class="card-name">${item.name}</p>
          <div class="card-footer">
            <span class="card-price ${item.price ? '' : 'unknown'}">${item.price || '—'}</span>
            ${item.url ? `<a class="card-link" href="${item.url}" target="_blank" rel="noopener">Voir <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 10L10 2M4.5 2H10v5.5"/></svg></a>` : ''}

  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,

function getMeta(doc, ...props) {
  for (const p of props) {
    const el = doc.querySelector(`meta[property="${p}"], meta[name="${p}"]`);
    if (el) { const c = el.getAttribute('content'); if (c) return c.trim(); }
  }
  return '';
}

async function tryProxy(proxyFn, rawUrl) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  try {
    const res = await fetch(proxyFn(rawUrl), { signal: ctrl.signal });
    if (!res.ok) throw new Error('err');
    const text = await res.text();
    let html = text;
    try { const j = JSON.parse(text); html = j.contents || j.body || text; } catch {}
    const doc   = new DOMParser().parseFromString(html, 'text/html');
    // Exige og:title (pas juste doc.title qui peut être une page d'erreur)
    const name  = getMeta(doc, 'og:title', 'twitter:title');
    const image = getMeta(doc, 'og:image:secure_url', 'og:image', 'twitter:image');
    const brand = getMeta(doc, 'og:site_name');
    const price = getMeta(doc, 'og:price:amount', 'product:price:amount', 'twitter:data1');
    if (!name) throw new Error('no og:title — probably error page');
    return { name: name.slice(0, 120), brand, price, img: image };
  } finally {
    clearTimeout(timer);
  }
}

async function fetchProductMeta(rawUrl) {
  urlWrap.classList.add('loading');
  urlHint.className = 'url-hint';
  urlHint.textContent = 'Récupération…';
  fpPreview.classList.remove('show');

  let meta = null;
  try { meta = await Promise.any(PROXIES.map(fn => tryProxy(fn, rawUrl))); } catch {}

  urlWrap.classList.remove('loading');

  if (!meta) {
    fetched.url = rawUrl;
    urlHint.className = 'url-hint err';
    urlHint.textContent = 'Récupération impossible — remplis manuellement';
    return;
  }

  fetched = { ...meta, url: rawUrl };
  fpBrand.textContent = meta.brand || new URL(rawUrl).hostname.replace('www.', '');
  fpName.textContent  = meta.name.slice(0, 60) || rawUrl;
  fpPrice.textContent = meta.price || '';
  fpImg.style.backgroundImage = meta.img ? `url('${meta.img}')` : '';
  if (!document.getElementById('f-name').value) document.getElementById('f-name').value = meta.name;
  if (!document.getElementById('f-brand').value) document.getElementById('f-brand').value = meta.brand;
  if (!document.getElementById('f-price').value) document.getElementById('f-price').value = meta.price;
  fpPreview.classList.add('show');
  urlHint.className = 'url-hint ok';
  urlHint.textContent = '✓ Infos récupérées automatiquement';
}

const IMGBB_KEY = 'acd76d70271edca10c6673ab9e3684b4';

document.getElementById('img-file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const hint = document.getElementById('img-upload-hint');
  hint.className = 'img-upload-hint';
  hint.textContent = 'Upload en cours…';

  const reader = new FileReader();
  reader.onload = async ev => {
    const base64 = ev.target.result.split(',')[1];
    try {
      const form = new FormData();
      form.append('key', IMGBB_KEY);
      form.append('image', base64);
      const res  = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (data.success) {
        const url = data.data.url;
        document.getElementById('f-img').value = url;
        // Met à jour la preview si elle est visible
        if (document.getElementById('fetch-preview').classList.contains('show')) {
          document.getElementById('fp-img').style.backgroundImage = `url('${url}')`;
        }
        hint.className = 'img-upload-hint ok';
        hint.textContent = '✓ Image uploadée';
      } else throw new Error();
    } catch {
      hint.className = 'img-upload-hint err';
      hint.textContent = 'Échec de l\'upload — réessaie';
    }
  };
  reader.readAsDataURL(file);
});

function buildCatPicker(selectedCat) {
  const picker = document.getElementById('cat-picker');
  const input  = document.getElementById('f-cat');
  picker.innerHTML = '';
  input.style.display = 'none';
  input.value = selectedCat || '';

  const existing = [...new Set(items.map(i => i.cat).filter(Boolean))];

  existing.forEach(cat => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cp-tag' + (cat === selectedCat ? ' selected' : '');
    btn.textContent = cat;
    btn.addEventListener('click', () => {
      picker.querySelectorAll('.cp-tag').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      input.value = cat;
      input.style.display = 'none';
    });
    picker.appendChild(btn);
  });

  const newBtn = document.createElement('button');
  newBtn.type = 'button';
  newBtn.className = 'cp-tag new-tag';
  newBtn.textContent = '+ Nouvelle';
  newBtn.addEventListener('click', () => {
    picker.querySelectorAll('.cp-tag').forEach(b => b.classList.remove('selected'));
    newBtn.classList.add('selected');
    input.style.display = 'block';
    input.value = '';
    input.focus();
  });
  picker.appendChild(newBtn);

  // Si la catégorie n'est pas dans la liste existante → activer "Nouvelle" avec sa valeur
  if (selectedCat && !existing.includes(selectedCat)) {
    newBtn.classList.add('selected');
    input.style.display = 'block';
    input.value = selectedCat;
  }
}

function initials(name) { return (name || '?').charAt(0).toUpperCase(); }

let myRequests = []; // toutes les demandes me concernant

async function loadAllRequests() {
  const { data } = await db.from('friend_requests')
    .select('*')
    .or(`from_id.eq.${currentUser.id},to_id.eq.${currentUser.id}`);
  myRequests = data || [];
}

function getRelation(uid) {
  const req = myRequests.find(r =>
    (r.from_id === currentUser.id && r.to_id === uid) ||
    (r.from_id === uid && r.to_id === currentUser.id)
  );
  if (!req) return { type: 'none' };
  if (req.status === 'accepted') return { type: 'friend', req };
  if (req.from_id === currentUser.id) return { type: 'sent', req };
  return { type: 'received', req };
}

function makeAvatarEl(u) {
  const av = document.createElement('div');
  av.className = 'friend-avatar';
  av.innerHTML = u.avatar ? `<img src="${u.avatar}" alt="">` : initials(u.name);
  return av;
}

function makeFriendRow(u, buttons = []) {
  const row = document.createElement('div');
  row.className = 'friend-row';
  row.appendChild(makeAvatarEl(u));
  const nm = document.createElement('span');
  nm.className = 'friend-name';
  nm.textContent = u.name;
  row.appendChild(nm);
  buttons.forEach(({ label, cls, onClick }) => {
    const btn = document.createElement('button');
    btn.className = `friend-action ${cls}`;
    btn.textContent = label;
    if (onClick) btn.addEventListener('click', onClick);
    row.appendChild(btn);
  });
  return row;
}

async function loadFriends() {
  await loadAllRequests();
  const accepted = myRequests.filter(r => r.status === 'accepted');
  const friendIds = accepted.map(r => r.from_id === currentUser.id ? r.to_id : r.from_id);
  friendsList.innerHTML = '';
  if (friendIds.length === 0) {
    friendsList.innerHTML = '<p style="font-size:13px;color:var(--muted);padding:8px 0">Aucun ami pour l\'instant</p>';
  } else {
    prefetchFriendWishlists(friendIds); // prefetch en arrière-plan
    const { data } = await db.from('users').select('id, name, avatar').in('id', friendIds);
    (data || []).forEach(u => {
      const row = makeFriendRow(u, [
        { label: 'Retirer', cls: 'remove', onClick: () => removeFriend(u.id) }
      ]);
      row.style.cursor = 'pointer';
      const openFriendProfile = () => {
        closeProfile();
        openFriendView(u);
      };
      row.querySelector('.friend-name').addEventListener('click', openFriendProfile);
      row.querySelector('.friend-avatar').addEventListener('click', openFriendProfile);
      friendsList.appendChild(row);
    });
  }
  await loadIncomingRequests();
}

async function loadIncomingRequests() {
  const incoming = myRequests.filter(r => r.to_id === currentUser.id && r.status === 'pending');
  const section = document.getElementById('requests-section');
  const list = document.getElementById('requests-list');
  list.innerHTML = '';
  section.hidden = incoming.length === 0;
  if (incoming.length === 0) return;
  const fromIds = incoming.map(r => r.from_id);
  const { data } = await db.from('users').select('id, name, avatar').in('id', fromIds);
  incoming.forEach(req => {
    const u = (data || []).find(x => x.id === req.from_id);
    if (!u) return;
    list.appendChild(makeFriendRow(u, [
      { label: 'Accepter', cls: 'accept', onClick: () => acceptRequest(req.id) },
      { label: 'Refuser', cls: 'decline', onClick: () => declineRequest(req.id) },
    ]));
  });
}

async function sendRequest(toId) {
  await db.from('friend_requests').insert({ from_id: currentUser.id, to_id: toId, status: 'pending' });
  await loadAllRequests();
  const q = document.getElementById('friends-search').value.trim();
  if (q.length >= 2) searchFriends(q);
}

async function acceptRequest(reqId) {
  await db.from('friend_requests').update({ status: 'accepted' }).eq('id', reqId);
  loadFriends();
}

async function declineRequest(reqId) {
  await db.from('friend_requests').delete().eq('id', reqId);
  loadFriends();
}

async function removeFriend(uid) {
  const req = myRequests.find(r =>
    (r.from_id === currentUser.id && r.to_id === uid) ||
    (r.from_id === uid && r.to_id === currentUser.id)
  );
  if (req) await db.from('friend_requests').delete().eq('id', req.id);
  loadFriends();
}

async function searchFriends(q) {
  const results = document.getElementById('friends-search-results');
  if (q.length < 2) { results.innerHTML = ''; return; }
  const { data } = await db.from('users').select('id, name, avatar').ilike('name', `%${q}%`).neq('id', currentUser.id).limit(5);
  results.innerHTML = '';
  if (!data || data.length === 0) {
    results.innerHTML = '<p style="font-size:12px;color:var(--muted);padding:6px 0">Aucun résultat</p>';
    return;
  }
  data.forEach(u => {
    const rel = getRelation(u.id);
    let btns = [];
    if (rel.type === 'friend') btns = [{ label: 'Amis ✓', cls: 'pending' }];
    else if (rel.type === 'sent') btns = [{ label: 'Demande envoyée', cls: 'pending' }];
    else if (rel.type === 'received') btns = [
      { label: 'Accepter', cls: 'accept', onClick: () => acceptRequest(rel.req.id) },
      { label: 'Refuser', cls: 'decline', onClick: () => declineRequest(rel.req.id) },
    ];
    else btns = [{ label: 'Demander', cls: '', onClick: () => sendRequest(u.id) }];
    results.appendChild(makeFriendRow(u, btns));
  });
}
