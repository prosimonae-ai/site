<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Liste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://use.typekit.net/kid8vvq.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #f7f6f3;
    --surface: #ffffff;
    --border:  #e5e3de;
    --text:    #111110;
    --muted:   #888580;
    --accent:  #111110;
    --tag-bg:  #eceae5;
    --pick:    #2d5a3d;
    --pick-bg: #e8f0eb;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ── LOCK SCREEN ── */
  #lock {
    position: fixed; inset: 0; z-index: 999;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
    transition: opacity 500ms ease, transform 500ms ease;
  }
  #lock.out { opacity: 0; transform: translateY(-8px); pointer-events: none; }

  .lock-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .lock-field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  #name-input, #pwd-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    text-align: center;
    width: 180px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 200ms;
  }
  #name-input { font-size: 15px; font-weight: 400; letter-spacing: 0.05em; }
  #name-input:focus, #pwd-input:focus { border-color: var(--text); }
  #name-input::placeholder { color: #ccc; }
  #pwd-input {
    font-size: 22px; font-weight: 300; letter-spacing: 0.5em;
  }
  #pwd-input::placeholder { letter-spacing: 0.2em; color: #ccc; font-size: 18px; }

  .lock-error {
    font-size: 11px;
    color: #c0392b;
    opacity: 0;
    transition: opacity 250ms;
    height: 14px;
  }
  .lock-error.show { opacity: 1; }

  #lock-btn {
    background: var(--text);
    border: none;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 150ms;
  }
  #lock-btn:hover { opacity: 0.75; }
  #lock-switch {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-top: 4px;
    text-decoration: underline;
    font-family: 'Inter', sans-serif;
  }
  #lock-switch:hover { color: var(--text); }

  /* ── VAULT ── */
  #the-liste { display: none; }
  #the-liste.visible { display: block; }

  /* Top bar supprimée — titre + compteur intégrés au filtre */
  .v-top {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 40px 32px;
    text-align: center;
  }
  .v-logo {
    font-family: 'stevie-sans', sans-serif;
    font-size: 52px;
    font-weight: 600;
    font-style: italic;
    letter-spacing: -0.03em;
    text-transform: none;
    color: var(--text);
    opacity: 0.12;
  }
  #item-count {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* Filters */
  .v-filters {
    padding: 0 40px 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 1200px;
    margin: 0 auto;
  }
  .v-filters::-webkit-scrollbar { display: none; }

  /* Bouton add — flottant, cercle fin, zen */
  #add-btn {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    background: var(--text);
    border: 1px solid var(--text);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 12px 28px;
    border-radius: 100px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    transition: border-color 200ms, color 200ms, box-shadow 200ms;
  }
  #add-btn:hover { opacity: 0.85; box-shadow: 0 4px 28px rgba(0,0,0,0.2); }
  #add-btn svg { width: 10px; height: 10px; opacity: 0.7; }

  .cat-btn {
    background: none;
    border: none;
    color: rgba(0,0,0,0.3);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    border-radius: 100px;
    cursor: pointer;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    transition: color 200ms, background 200ms;
  }
  .cat-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .cat-btn:hover { color: var(--text); }
  .cat-btn.active { background: var(--text); color: #fff; }

  /* Bento */
  .v-bento {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 40px 120px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .wish-card {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid rgba(0,0,0,0.06);
    cursor: default;
    aspect-ratio: 1;
    transition: box-shadow 400ms ease, transform 400ms ease;
    animation: cardIn 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .wish-card:hover { box-shadow: 0 12px 48px rgba(0,0,0,0.07); transform: translateY(-2px); }

  .card-bg {
    position: absolute;
    inset: 32px 32px 72px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    mix-blend-mode: multiply;
    transition: transform 400ms ease;
  }
  .wish-card:hover .card-bg { transform: scale(1.05); }

  .card-body {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
  }

  .card-tags { display: none; }
  .cat-tag, .pick-tag { display: none; }

  .card-actions {
    display: flex; gap: 4px;
    opacity: 0;
    transition: opacity 150ms;
  }
  .wish-card:hover .card-actions { opacity: 1; }

  .card-del, .card-edit {
    background: rgba(255,255,255,0.85);
    border: none;
    cursor: pointer;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: color 150ms, background 150ms;
    backdrop-filter: blur(4px);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card-del  { color: var(--muted); }
  .card-edit { color: var(--muted); }
  .card-del:hover  { color: #c0392b; background: #fdf0ee; }
  .card-edit:hover { color: var(--text); background: var(--tag-bg); }
  .card-del svg, .card-edit svg { width: 10px; height: 10px; }

  .card-bottom {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .card-brand {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.3);
  }
  .card-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 5px;
  }
  .card-price {
    font-size: 12px;
    font-weight: 400;
    color: rgba(0,0,0,0.45);
  }
  .card-price.unknown { display: none; }
  .card-link {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.25);
    text-decoration: none;
    display: flex; align-items: center; gap: 3px;
    transition: color 200ms;
  }
  .card-link:hover { color: var(--text); }
  .card-link svg { width: 8px; height: 8px; }

  .v-empty {
    grid-column: 1/-1;
    padding: 64px 0;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── MODAL ── */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 250ms;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    transform: translateY(10px);
    transition: transform 250ms ease;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }

  .modal-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--text);
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field label .auto-badge {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: none;
    color: var(--pick);
    background: var(--pick-bg);
    padding: 1px 6px;
    border-radius: 100px;
  }
  .field input, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 150ms;
  }
  .field input:focus { border-color: var(--text); }
  .field input::placeholder { color: #bbb; }

  /* URL field special */
  .url-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .url-wrap input { padding-right: 36px; }
  .url-spinner {
    position: absolute; right: 10px;
    width: 14px; height: 14px;
    border: 1.5px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .url-wrap.loading .url-spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .url-hint {
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
    transition: color 200ms;
  }
  .url-hint.ok { color: var(--pick); }
  .url-hint.err { color: #c0392b; }

  /* Fetch preview card */
  .fetch-preview {
    display: none;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .fetch-preview.show { display: flex; }
  .fp-img {
    width: 64px; height: 64px;
    flex-shrink: 0;
    border-radius: 6px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    background-color: #fff;
    border: 1px solid var(--border);
  }
  .fp-info { flex: 1; min-width: 0; }
  .fp-brand { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .fp-name  { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .fp-price { font-size: 12px; color: var(--muted); }


  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn-cancel {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: border-color 150ms;
  }
  .btn-cancel:hover { border-color: var(--muted); }
  .btn-add {
    flex: 2;
    background: var(--text);
    border: none;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: opacity 150ms;
  }
  .btn-add:hover { opacity: 0.75; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .field-row .field { margin-bottom: 0; }

  .cat-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .cp-tag {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 13px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 150ms, color 150ms, border-color 150ms;
  }
  .cp-tag:hover { border-color: var(--text); color: var(--text); }
  .cp-tag.selected { background: var(--text); border-color: var(--text); color: #fff; }
  .cp-tag.new-tag { border-style: dashed; }

  .img-upload-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .img-upload-row input[type="url"] { flex: 1; }
  .img-upload-btn {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: border-color 150ms, background 150ms;
    color: var(--muted);
  }
  .img-upload-btn:hover { border-color: var(--text); color: var(--text); background: var(--surface); }
  .img-upload-btn svg { width: 14px; height: 14px; }
  .img-upload-hint { font-size: 10px; color: var(--muted); margin-top: 4px; min-height: 14px; }
  .img-upload-hint.ok  { color: var(--pick); }
  .img-upload-hint.err { color: #c0392b; }

  .fallback-banner {
    background: #fef8ec;
    border: 1px solid #f0d98a;
    border-radius: 6px;
    color: #7a5f10;
    font-size: 11px;
    padding: 9px 12px;
    margin-bottom: 14px;
    line-height: 1.4;
  }

  @media (max-width: 600px) {
    .v-bento { grid-template-columns: 1fr; padding: 12px 16px 100px; gap: 10px; }
    .v-top { padding: 52px 16px 32px; }
    .v-filters { padding: 0 16px; }
  }
</style>

<!-- LOCK -->
<div id="lock">
  <p class="lock-eyebrow" id="lock-title">The Liste</p>
  <div class="lock-field">
    <input id="name-input" type="text" placeholder="Prénom" maxlength="30" autocomplete="off" autocapitalize="none">
    <input id="pwd-input" type="password" placeholder="····" maxlength="20" autocomplete="off">
    <p class="lock-error" id="lock-error">Identifiants incorrects</p>
    <button id="lock-btn" type="button">Entrer</button>
    <button id="lock-switch" type="button">Créer un compte</button>
  </div>
</div>

<!-- VAULT -->
<div id="the-liste">
  <div class="v-top">
    <p class="v-logo">The Liste</p>
  </div>

  <nav class="v-filters" id="cat-nav"></nav>

  <button id="add-btn" type="button">
    <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 1v10M1 6h10"/></svg>
    Ajouter
  </button>

  <div class="v-bento" id="wish-list"></div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <p class="modal-title">Ajouter un objet</p>

    <div class="field">
      <label>Lien produit</label>
      <div class="url-wrap" id="url-wrap">
        <input id="f-url" type="url" placeholder="Colle le lien du produit…">
        <div class="url-spinner"></div>
      </div>
      <p class="url-hint" id="url-hint">L'image, le nom et le prix sont récupérés automatiquement</p>
    </div>

    <!-- Preview card après fetch -->
    <div class="fetch-preview" id="fetch-preview">
      <div class="fp-img" id="fp-img"></div>
      <div class="fp-info">
        <p class="fp-brand" id="fp-brand"></p>
        <p class="fp-name" id="fp-name"></p>
        <p class="fp-price" id="fp-price"></p>
      </div>
    </div>

    <!-- Champs toujours visibles -->
    <div id="fallback-fields">
      <div class="fallback-banner">Ce site bloque la récupération automatique — remplis les infos :</div>
      <div class="field">
        <label>Nom du produit *</label>
        <input id="f-name" type="text" placeholder="Canapé Play 2 places bleu">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Marque</label>
          <input id="f-brand" type="text" placeholder="Maisons du Monde">
        </div>
        <div class="field">
          <label>Prix</label>
          <input id="f-price" type="text" placeholder="499 €">
        </div>
      </div>
      <div class="field">
        <label>Image</label>
        <div class="img-upload-row">
          <input id="f-img" type="url" placeholder="URL ou upload ci-contre…">
          <label class="img-upload-btn" id="img-upload-label">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 1v8M4 4l3-3 3 3M2 11h10"/></svg>
            <input type="file" id="img-file-input" accept="image/*" style="display:none">
          </label>
        </div>
        <p class="img-upload-hint" id="img-upload-hint"></p>
      </div>
    </div>

    <!-- Catégorie -->
    <div class="field" id="cat-field">
      <label>Catégorie</label>
      <div class="cat-picker" id="cat-picker"></div>
      <input id="f-cat" type="text" placeholder="Nom de la catégorie…" style="display:none; margin-top:8px;">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Annuler</button>
      <button class="btn-add" id="modal-confirm">Ajouter</button>
    </div>
  </div>
</div>

<script>
let currentUser = null;
const SB_URL = 'https://vxzjfwjxgewdqvfdsxjm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4empmd2p4Z2V3ZHF2ZmRzeGptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTM1MDcsImV4cCI6MjEwNDM4OTUwN30.IuIcPXXrVozPDDreB-hkY1didQoboV0pEuH8-8GaWLo';
const db = window.supabase.createClient(SB_URL, SB_KEY);

async function load(userId) {
  try {
    const { data, error } = await db.from('wishlist').select('items').eq('id', userId).single();
    if (error) {
      if (error.code === 'PGRST116') {
        await db.from('wishlist').insert({ id: userId, items: [] });
        return [];
      }
      throw new Error(error.message);
    }
    return Array.isArray(data?.items) ? data.items : [];
  } catch(e) {
    console.warn('[liste] load failed:', e.message);
    return [];
  }
}

async function save(items) {
  try { localStorage.setItem(`the-liste_${currentUser.id}`, JSON.stringify(items)); } catch {}
  try {
    const { error } = await db.from('wishlist').upsert({ id: currentUser.id, items });
    if (error) throw new Error(error.message);
    console.log('[liste] saved:', items.length, 'items');
  } catch(e) {
    console.error('[liste] save failed:', e.message);
  }
}

/* LOCK */
const lockEl = document.getElementById('lock');
const nameInput = document.getElementById('name-input');
const pwdInput = document.getElementById('pwd-input');
const lockErr = document.getElementById('lock-error');
const lockBtn = document.getElementById('lock-btn');
const lockSwitch = document.getElementById('lock-switch');
const lockTitle = document.getElementById('lock-title');
let lockMode = 'login'; // 'login' | 'register'

lockSwitch.addEventListener('click', () => {
  lockMode = lockMode === 'login' ? 'register' : 'login';
  lockTitle.textContent = lockMode === 'register' ? 'Créer un compte' : 'The Liste';
  lockBtn.textContent = lockMode === 'register' ? 'Créer' : 'Entrer';
  lockSwitch.textContent = lockMode === 'register' ? 'Déjà un compte' : 'Créer un compte';
  lockErr.classList.remove('show');
  nameInput.value = ''; pwdInput.value = '';
  nameInput.focus();
});

async function loginOrRegister() {
  const nameVal = nameInput.value.trim().toLowerCase();
  const passVal = pwdInput.value.trim();
  if (!nameVal || !passVal) return;

  if (lockMode === 'register') {
    const { data: existing } = await db.from('users').select('id').eq('id', nameVal).single();
    if (existing) {
      lockErr.textContent = 'Ce prénom est déjà pris';
      lockErr.classList.add('show');
      setTimeout(() => lockErr.classList.remove('show'), 2500);
      return;
    }
    const displayName = nameInput.value.trim().charAt(0).toUpperCase() + nameInput.value.trim().slice(1);
    const { error } = await db.from('users').insert({ id: nameVal, password: passVal, name: displayName });
    if (error) { console.error(error); return; }
  }

  const { data, error } = await db.from('users').select('*').eq('id', nameVal).eq('password', passVal).single();
  if (error || !data) {
    lockErr.textContent = 'Identifiants incorrects';
    lockErr.classList.add('show');
    pwdInput.value = '';
    pwdInput.focus();
    setTimeout(() => lockErr.classList.remove('show'), 2000);
    return;
  }
  currentUser = data;
  lockEl.classList.add('out');
  setTimeout(() => lockEl.style.display = 'none', 520);
  document.getElementById('the-liste').classList.add('visible');
  document.querySelector('.v-logo').textContent = `The Liste · ${data.name}`;
  items = await load(currentUser.id);
  render();
}

const PROXIES = [
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

function getMeta(doc, ...props) {
  for (const p of props) {
    const el = doc.querySelector(`meta[property="${p}"], meta[name="${p}"]`);
    if (el) { const c = el.getAttribute('content'); if (c) return c.trim(); }
  }
  return '';
}

async function tryProxy(proxyFn, rawUrl) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  try {
    const res = await fetch(proxyFn(rawUrl), { signal: ctrl.signal });
    if (!res.ok) throw new Error('err');
    const text = await res.text();
    let html = text;
    try { const j = JSON.parse(text); html = j.contents || j.body || text; } catch {}
    const doc   = new DOMParser().parseFromString(html, 'text/html');
    // Exige og:title (pas juste doc.title qui peut être une page d'erreur)
    const name  = getMeta(doc, 'og:title', 'twitter:title');
    const image = getMeta(doc, 'og:image:secure_url', 'og:image', 'twitter:image');
    const brand = getMeta(doc, 'og:site_name');
    const price = getMeta(doc, 'og:price:amount', 'product:price:amount', 'twitter:data1');
    if (!name) throw new Error('no og:title — probably error page');
    return { name: name.slice(0, 120), brand, price, img: image };
  } finally {
    clearTimeout(timer);
  }
}

async function fetchProductMeta(rawUrl) {
  urlWrap.classList.add('loading');
  urlHint.className = 'url-hint';
  urlHint.textContent = 'Récupération…';
  fpPreview.classList.remove('show');

  let meta = null;
  try { meta = await Promise.any(PROXIES.map(fn => tryProxy(fn, rawUrl))); } catch {}

  urlWrap.classList.remove('loading');

  if (!meta) {
    fetched.url = rawUrl;
    urlHint.className = 'url-hint err';
    urlHint.textContent = 'Récupération impossible — remplis manuellement';
    return;
  }

  fetched = { ...meta, url: rawUrl };
  fpBrand.textContent = meta.brand || new URL(rawUrl).hostname.replace('www.', '');
  fpName.textContent  = meta.name.slice(0, 60) || rawUrl;
  fpPrice.textContent = meta.price || '';
  fpImg.style.backgroundImage = meta.img ? `url('${meta.img}')` : '';
  if (!document.getElementById('f-name').value) document.getElementById('f-name').value = meta.name;
  if (!document.getElementById('f-brand').value) document.getElementById('f-brand').value = meta.brand;
  if (!document.getElementById('f-price').value) document.getElementById('f-price').value = meta.price;
  fpPreview.classList.add('show');
  urlHint.className = 'url-hint ok';
  urlHint.textContent = '✓ Infos récupérées automatiquement';
}

document.getElementById('f-url').addEventListener('input', e => {
  const val = e.target.value.trim();
  clearTimeout(fetchTimer);
  fpPreview.classList.remove('show');
  fetched = { name:'', brand:'', price:'', img:'', url:'' };
  if (!val) { urlHint.className = 'url-hint'; urlHint.textContent = 'Optionnel — colle le lien pour auto-remplir'; return; }
  try { new URL(val); } catch { return; }
  fetchTimer = setTimeout(() => fetchProductMeta(val), 700);
});

  ['f-url','f-cat','f-name','f-brand','f-price','f-img'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });

const IMGBB_KEY = 'acd76d70271edca10c6673ab9e3684b4';

document.getElementById('img-file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const hint = document.getElementById('img-upload-hint');
  hint.className = 'img-upload-hint';
  hint.textContent = 'Upload en cours…';

  const reader = new FileReader();
  reader.onload = async ev => {
    const base64 = ev.target.result.split(',')[1];
    try {
      const form = new FormData();
      form.append('key', IMGBB_KEY);
      form.append('image', base64);
      const res  = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: form });
      const data = await res.json();
      if (data.success) {
        const url = data.data.url;
        document.getElementById('f-img').value = url;
        // Met à jour la preview si elle est visible
        if (document.getElementById('fetch-preview').classList.contains('show')) {
          document.getElementById('fp-img').style.backgroundImage = `url('${url}')`;
        }
        hint.className = 'img-upload-hint ok';
        hint.textContent = '✓ Image uploadée';
      } else throw new Error();
    } catch {
      hint.className = 'img-upload-hint err';
      hint.textContent = 'Échec de l\'upload — réessaie';
    }
  };
  reader.readAsDataURL(file);
});

function buildCatPicker(selectedCat) {
  const picker = document.getElementById('cat-picker');
  const input  = document.getElementById('f-cat');
  picker.innerHTML = '';
  input.style.display = 'none';
  input.value = selectedCat || '';

  const existing = [...new Set(items.map(i => i.cat).filter(Boolean))];

  existing.forEach(cat => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cp-tag' + (cat === selectedCat ? ' selected' : '');
    btn.textContent = cat;
    btn.addEventListener('click', () => {
      picker.querySelectorAll('.cp-tag').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      input.value = cat;
      input.style.display = 'none';
    });
    picker.appendChild(btn);
  });

  const newBtn = document.createElement('button');
  newBtn.type = 'button';
  newBtn.className = 'cp-tag new-tag';
  newBtn.textContent = '+ Nouvelle';
  newBtn.addEventListener('click', () => {
    picker.querySelectorAll('.cp-tag').forEach(b => b.classList.remove('selected'));
    newBtn.classList.add('selected');
    input.style.display = 'block';
    input.value = '';
    input.focus();
  });
  picker.appendChild(newBtn);

  // Si la catégorie n'est pas dans la liste existante → activer "Nouvelle" avec sa valeur
  if (selectedCat && !existing.includes(selectedCat)) {
    newBtn.classList.add('selected');
    input.style.display = 'block';
    input.value = selectedCat;
  }
}

function openEdit(item) {
  resetModal();
  editingId = item.id;
  document.querySelector('.modal-title').textContent = 'Modifier l\'objet';
  document.getElementById('modal-confirm').textContent = 'Enregistrer';

  // Pré-rempli via fallback fields (on a déjà les données)
  fetched = { name: item.name, brand: item.brand, price: item.price, img: item.img, url: item.url };
  document.getElementById('f-url').value = item.url || '';
  document.getElementById('f-name').value = item.name || '';
  document.getElementById('f-brand').value = item.brand || '';
  document.getElementById('f-price').value = (item.price || '').replace(/\s*€.*$/, '').trim();
  document.getElementById('f-img').value = item.img || '';
  document.getElementById('f-cat').value = item.cat || '';

  if (item.img) {
    fpImg.style.backgroundImage = `url('${item.img}')`;
    fpBrand.textContent = item.brand || '';
    fpName.textContent  = item.name  || '';
    fpPrice.textContent = item.price || '';
    fpPreview.classList.add('show');
  }
  buildCatPicker(item.cat);
  urlHint.className = 'url-hint';
  urlHint.textContent = 'Modifie les infos ci-dessous';
  modal.classList.add('open');
}

document.getElementById('modal-confirm').addEventListener('click', async () => {
  const url  = document.getElementById('f-url').value.trim();

  if (!name) { document.getElementById('f-name').focus(); return; }

  const rawPrice = (document.getElementById('f-price').value.trim() || fetched.price || '').replace(/\s*[€$£¥].*$/, '').trim();
  const price = rawPrice ? rawPrice + ' €' : '';

  const updated = {
    name,
    brand: document.getElementById('f-brand').value.trim() || fetched.brand,
    price,
    cat:   document.getElementById('f-cat').value.trim(),
    img:   document.getElementById('f-img').value.trim() || fetched.img,
    url,
    pick:  false,
  };

  if (editingId) {
    items = items.map(i => i.id === editingId ? { ...i, ...updated } : i);
  } else {
    items.unshift({ id: Date.now().toString(36), ...updated });
  }

  await save(items);
  activeCat = 'all';
  render();
  modal.classList.remove('open');
  editingId = null;
});
